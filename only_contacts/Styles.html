<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-muted: #edf1f5;
    --line: #d9e0e8;
    --text: #17202a;
    --muted: #617080;
    --accent: #0f766e;
    --accent-dark: #115e59;
    --danger: #b42318;
    --ok: #0f7a4f;
    --warning-bg: #fff1f1;
    --shadow: 0 16px 40px rgba(21, 34, 50, 0.10);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }

  .is-hidden {
    display: none !important;
  }

  .app-shell {
    display: grid;
    grid-template-columns: 236px 1fr;
    min-height: 100vh;
  }

  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    border-right: 1px solid var(--line);
    background: #102027;
    color: #fff;
    padding: 22px 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
  }

  .brand-mark {
    display: inline-grid;
    width: 36px;
    height: 36px;
    place-items: center;
    border-radius: 8px;
    background: var(--accent);
    font-weight: 900;
  }

  .brand-text {
    font-size: 17px;
    font-weight: 900;
  }

  .nav {
    display: grid;
    gap: 8px;
  }

  .nav-link {
    border-radius: 6px;
    color: rgba(255, 255, 255, 0.78);
    font-weight: 800;
    padding: 10px 12px;
    text-decoration: none;
  }

  .nav-link:hover,
  .nav-link.active {
    background: rgba(255, 255, 255, 0.10);
    color: #fff;
  }

  .main {
    min-width: 0;
    padding: 30px;
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
  }

  .page-header {
    margin-bottom: 20px;
  }

  .page-header h1 {
    margin-bottom: 0;
    font-size: 30px;
    line-height: 1.15;
  }

  .filters {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin: 0 0 22px;
  }

  .filter-field {
    display: grid;
    gap: 6px;
  }

  .filter-field span {
    color: var(--muted);
    font-weight: 800;
  }

  .filter-field input,
  .filter-field select {
    min-width: 240px;
    max-width: min(540px, 80vw);
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-weight: 700;
    padding: 9px 10px;
  }

  .button {
    min-height: 41px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    padding: 9px 14px;
  }

  .button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .button:hover {
    border-color: var(--accent-dark);
  }

  .table-section {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: visible;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }

  .section-header h2 {
    margin-bottom: 0;
    font-size: 20px;
  }

  .count {
    color: var(--muted);
    font-weight: 800;
  }

  .table-wrap {
    overflow: auto;
    max-height: calc(100vh - 238px);
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }

  .contacts-table {
    min-width: 1180px;
  }

  .authorizations-table {
    width: max-content;
    min-width: 100%;
  }

  .students-table {
    min-width: 620px;
  }

  th,
  td {
    border-bottom: 1px solid var(--line);
    padding: 11px 13px;
    text-align: left;
    vertical-align: top;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--surface-muted);
    color: var(--muted);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .authorizations-table td {
    white-space: nowrap;
  }

  .contacts-table th:first-child,
  .contacts-table td:first-child,
  .students-table th:first-child,
  .students-table td:first-child {
    width: 190px;
    min-width: 190px;
    white-space: nowrap;
  }

  tr.student-band-even td {
    background: #fff;
  }

  tr.student-band-odd td {
    background: #f8fafc;
  }

  tr.missing-authorization td {
    background: #fff7f7;
  }

  .missing,
  .icon-empty {
    color: var(--muted);
  }

  .icon-ok {
    color: var(--ok);
    font-size: 18px;
    font-weight: 900;
  }

  .icon-no {
    color: var(--danger);
    font-size: 18px;
    font-weight: 900;
  }

  .source-badge {
    display: inline-block;
    margin-left: 8px;
    border: 1px solid #f3b9b5;
    border-radius: 999px;
    background: var(--warning-bg);
    color: var(--danger);
    font-size: 11px;
    font-weight: 900;
    line-height: 1;
    padding: 4px 7px;
    vertical-align: middle;
  }

  .detail-button {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--accent-dark);
    cursor: pointer;
    font: inherit;
    font-weight: 900;
    padding: 6px 10px;
  }

  .empty {
    margin: 0;
    padding: 20px;
    color: var(--muted);
  }

  .error-box {
    margin: 16px 20px 0;
    border: 1px solid #f3b9b5;
    border-radius: 6px;
    background: var(--warning-bg);
    color: var(--danger);
    font-weight: 700;
    padding: 12px 14px;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(246, 247, 249, 0.72);
  }

  .loader {
    width: 54px;
    height: 54px;
    border: 6px solid #d9e0e8;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loading-message {
    color: var(--text);
    font-weight: 800;
    text-align: center;
  }

  .export-button {
    position: fixed;
    right: 26px;
    bottom: 26px;
    z-index: 20;
    display: grid;
    width: 62px;
    height: 62px;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 14px 30px rgba(15, 118, 110, 0.30);
    cursor: pointer;
    font-weight: 900;
  }

  .export-button-large {
    width: 66px;
    height: 66px;
  }

  .export-icon {
    display: block;
    width: 38px;
    height: 38px;
    fill: currentColor;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: grid;
    place-items: center;
    background: rgba(16, 32, 39, 0.42);
    padding: 24px;
  }

  .modal-panel {
    width: min(860px, 100%);
    max-height: min(760px, 90vh);
    overflow: auto;
    border-radius: 8px;
    background: #fff;
    box-shadow: var(--shadow);
  }

  .modal-header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    background: #fff;
    padding: 16px 18px;
  }

  .modal-header h2 {
    margin: 0;
    font-size: 20px;
  }

  .modal-close {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
    padding: 4px 9px;
  }

  .modal-body {
    display: grid;
    gap: 14px;
    padding: 18px;
  }

  .detail-section {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
  }

  .detail-section h3 {
    margin-bottom: 10px;
    font-size: 16px;
  }

  .detail-section dl {
    display: grid;
    grid-template-columns: minmax(160px, 240px) 1fr;
    gap: 8px 14px;
    margin: 0;
  }

  .detail-section dt {
    color: var(--muted);
    font-weight: 900;
  }

  .detail-section dd {
    margin: 0;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (max-width: 820px) {
    .app-shell {
      grid-template-columns: 1fr;
    }

    .sidebar {
      position: static;
      height: auto;
    }

    .main {
      padding: 20px;
    }

    .filter-field,
    .filter-field input,
    .filter-field select,
    .button {
      width: 100%;
    }

    .table-wrap {
      max-height: none;
    }
  }
</style>

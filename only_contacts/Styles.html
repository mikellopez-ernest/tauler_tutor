<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-muted: #edf1f5;
    --line: #d9e0e8;
    --text: #17202a;
    --muted: #617080;
    --accent: #0f766e;
    --accent-dark: #115e59;
    --danger: #b42318;
    --shadow: 0 16px 40px rgba(21, 34, 50, 0.10);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  .is-hidden {
    display: none !important;
  }

  .main-shell {
    min-height: 100vh;
    padding: 32px;
  }

  .page-header {
    margin-bottom: 22px;
  }

  h1,
  h2,
  p {
    margin-top: 0;
  }

  h1 {
    margin-bottom: 0;
    font-size: 32px;
    line-height: 1.15;
  }

  h2 {
    margin-bottom: 0;
    font-size: 20px;
  }

  .filters {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin: 0 0 22px;
  }

  .filter-field {
    display: grid;
    gap: 6px;
  }

  .filter-field span {
    color: var(--muted);
    font-weight: 800;
  }

  .filter-field input,
  .filter-field select {
    min-width: 220px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-weight: 700;
    padding: 9px 10px;
  }

  .button {
    min-height: 41px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    padding: 9px 14px;
  }

  .button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }

  .button:hover {
    border-color: var(--accent-dark);
  }

  .table-section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: visible;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }

  .count {
    color: var(--muted);
    font-weight: 800;
  }

  .table-wrap {
    overflow: auto;
    max-height: calc(100vh - 230px);
  }

  table {
    width: 100%;
    min-width: 1040px;
    border-collapse: separate;
    border-spacing: 0;
  }

  th,
  td {
    border-bottom: 1px solid var(--line);
    padding: 12px 14px;
    text-align: left;
    vertical-align: top;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--surface-muted);
    color: var(--muted);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0;
    text-transform: uppercase;
  }

  .contacts-table th:first-child,
  .contacts-table td:first-child {
    width: 170px;
    min-width: 170px;
    white-space: nowrap;
  }

  tr.student-band-even td {
    background: #fff;
  }

  tr.student-band-odd td {
    background: #f8fafc;
  }

  .missing {
    color: var(--muted);
  }

  .source-badge {
    display: inline-block;
    margin-left: 8px;
    border: 1px solid #f3b9b5;
    border-radius: 999px;
    background: #fff1f1;
    color: var(--danger);
    font-size: 11px;
    font-weight: 900;
    line-height: 1;
    padding: 4px 7px;
    vertical-align: middle;
  }

  .empty {
    margin: 0;
    padding: 20px;
    color: var(--muted);
  }

  .error-box {
    margin: 16px 20px 0;
    border: 1px solid #f3b9b5;
    border-radius: 6px;
    background: #fff1f1;
    color: var(--danger);
    font-weight: 700;
    padding: 12px 14px;
  }

  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(246, 247, 249, 0.72);
  }

  .loader {
    width: 54px;
    height: 54px;
    border: 6px solid #d9e0e8;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loading-message {
    color: var(--text);
    font-weight: 700;
    text-align: center;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (max-width: 720px) {
    .main-shell {
      padding: 20px;
    }

    .filter-field,
    .filter-field input,
    .filter-field select,
    .button {
      width: 100%;
    }

    .table-wrap {
      max-height: none;
    }
  }
</style>

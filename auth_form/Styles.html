<style>
:root { --bs-primary-rgb: 24,64,95; }
    body { background:#f4f6f8; }
    .form-shell { max-width:1080px; }
    .form-loading-overlay { position:fixed; inset:0; z-index:3000; display:flex; align-items:center; justify-content:center; background:#f4f6f8; color:#17202a; }
    .form-loading-overlay.is-hidden { display:none; }
    .form-loading-card { display:flex; flex-direction:column; align-items:center; gap:.75rem; background:#fff; border:1px solid #d9e0e8; border-radius:.5rem; padding:1.6rem 2.1rem; box-shadow:0 1rem 2.5rem rgba(21,34,50,.12); font-weight:800; }
    .form-loading-spinner { width:42px; height:42px; border:4px solid #d9e0e8; border-top-color:rgb(var(--bs-primary-rgb)); border-radius:50%; animation:formSpin .8s linear infinite; }
    .form-loading-note { color:#617080; font-size:.9rem; font-weight:400; }
    @keyframes formSpin { to { transform:rotate(360deg); } }
    .section-card { border:0; box-shadow:0 .15rem .65rem rgba(0,0,0,.08); }
    .section-title { border-bottom:3px solid #212529; padding-bottom:.45rem; }
    .legal-box { background:#e9ecef; border-left:4px solid #6c757d; font-size:.91rem; }
    .legal-document { max-height:420px; overflow:auto; padding:1rem; border:1px solid #dee2e6; border-radius:.5rem; background:#fff; }
    .legal-document li { margin-bottom:.45rem; }
    .question { padding:1rem; border:1px solid #dee2e6; border-radius:.5rem; background:#fff; }
    .question.has-validation-error { border-color:#dc3545; box-shadow:0 0 0 .08rem rgba(220,53,69,.18); }
    .validation-summary { border-left:4px solid #dc3545; }
    .validation-summary ul { margin:.5rem 0 0; padding-left:1.15rem; }
    .field-validation-message { color:#dc3545; font-size:.875rem; margin-top:.35rem; }
    .option-grid { display:grid; gap:.85rem; }
    .option-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:1rem; align-items:start; }
    .option-row-child, .option-heading-child { margin-left:1.5rem; }
    .option-row-grandchild { margin-left:3rem; }
    .option-heading { margin-top:.35rem; }
    .option-controls { display:flex; flex-wrap:wrap; gap:1rem; min-width:8rem; }
    .signature-pad { width:100%; height:150px; border:1px dashed #6c757d; border-radius:.375rem; background:#fff; touch-action:none; }

    .required::after,
    .required-question::after,
    .question:not(.optional-question) > h3.h6::after,
    .question:not(.optional-question) .option-label::after,
    .question:not(.optional-question) .option-heading::after,
    :not(.optional-question) > label.form-label:not(.required)::after,
    :not(.optional-question) > .form-label:not(.required)::after {
      content:" *";
      color:#dc3545;
    }
    .optional-question h3.h6::after,
    .optional-question label.form-label::after {
      content:none !important;
    }
    .is-hidden { display:none !important; }
    .translate-box { min-width:280px; }
    .student-banner {
      border: 1px solid #d9e0e8;
      border-radius: .5rem;
      background: #fff;
      color: #17202a;
      padding: .75rem 1rem;
    }
    .submission-success {
      outline: none;
    }
    .submission-success .lead {
      color: #17202a;
    }
    @media print {
      body { background:#fff; font-size:11pt; }
      .form-loading-overlay { display:none !important; }
      .no-print, .sticky-actions { display:none !important; }
      .section-card { box-shadow:none; break-inside:avoid; }
      .accordion-collapse { display:block !important; }
      .accordion-button { box-shadow:none !important; padding-left:0; }

      .legal-document { max-height:none; overflow:visible; border:0; padding:0; }
      .question { break-inside:avoid; }
    }
  .dependent-field {
    border-left: 3px solid #d9e0e8;
    margin-left: 1rem;
    padding-left: 1rem;
    width: calc(100% - 1rem);
  }
  @media (max-width: 767.98px) {
    .option-row { grid-template-columns:1fr; gap:.35rem; }
    .option-row-child, .option-heading-child { margin-left:.75rem; }
    .option-row-grandchild { margin-left:1.5rem; }
    .option-controls { min-width:0; }
  }
</style>

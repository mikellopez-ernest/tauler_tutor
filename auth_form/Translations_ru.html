    "Compartir amb el centre l'educació de l'alumne/a i afavorir el seu desenvolupament acadèmic i personal.": "Разделять со школой ответственность за образование учащегося и способствовать его академическому и личностному развитию.",
    "Considerar les recomanacions del centre relatives a atenció educativa, derivacions, repetició o promoció de curs i orientació acadèmica.": "Учитывать рекомендации школы по образовательной поддержке, направлениям, повторению или переходу в следующий класс и академической ориентации.",
    "Instar l'alumne/a a respectar les normes de funcionament del centre, el deure d'estudi, el respecte als altres i les normes de convivència.": "Побуждать учащегося соблюдать правила школы, обязанность учиться, уважение к другим и нормы сосуществования.",
    "Facilitar a l'institut informacions rellevants per al procés d'aprenentatge i la salut de l'alumne/a.": "Предоставлять школе информацию, важную для процесса обучения и здоровья учащегося.",
    "Aportar documents de justificació oficial en cas d'absència.": "Предоставлять официальные подтверждающие документы в случае отсутствия.",
    "No enviar l'alumne/a a l'institut quan tingui febre, malalties contagioses, infeccions per polls o causes equivalents, i recollir-lo personalment o mitjançant una persona major d'edat autoritzada quan calgui.": "Не отправлять учащегося в школу при температуре, заразных заболеваниях, педикулезе или аналогичных причинах, а при необходимости забирать его лично или через уполномоченного совершеннолетнего.",
    "Atendre en un període raonable les peticions d'entrevista o comunicació del centre i assistir puntualment a les reunions.": "В разумный срок отвечать на запросы школы о встрече или общении и приходить на собрания пунктуально.",
    "Respectar les NOFC i la regulació dels telèfons mòbils.": "Соблюдать NOFC и правила использования мобильных телефонов.",
    "Informar l'alumne/a menor d'edat de la signatura d'aquesta Carta de compromís educatiu i del que implica.": "Информировать несовершеннолетнего учащегося о подписании этого образовательного соглашения и его значении.",
    "I perquè així consti, ho signem a tots els efectes, a partir de la data d'avui.": "В подтверждение этого мы подписываем документ для всех целей, начиная с сегодняшней даты.",
    "He llegit i accepto la Carta de compromís educatiu.": "Я прочитал(а) и принимаю образовательное соглашение.",
    "7. Normativa d'ús de telèfons mòbils": "7. Правила использования мобильных телефонов",
    "Normativa d'ús de telèfons mòbils": "Правила использования мобильных телефонов",
    "Arran de l'aprovació de l'actualització de les NOFC, us informem de la normativa que regularà l'ús dels telèfons mòbils a l'institut Ernest Lluch i Martín.": "После утверждения обновления NOFC мы информируем вас о правилах, регулирующих использование мобильных телефонов в Institut Ernest Lluch i Martín.",
    "El centre entén que no hi ha cap urgència que justifiqui la utilització del telèfon mòbil. L'institut disposa de telèfon i personal de consergeria per agilitzar qualsevol informació que hagi d'arribar de les famílies a l'alumnat i viceversa.": "Школа считает, что нет срочной необходимости, оправдывающей использование мобильного телефона. В школе есть телефон и сотрудники приемной, чтобы оперативно передавать любую информацию между семьями и учащимися.",
    "L'ús de telèfons mòbils està prohibit per a l'alumnat en tots els espais del centre educatiu i en totes les activitats educatives que puguin tenir lloc fora del centre. La tinència del dispositiu només és possible si està completament apagat en entrar al centre i si l'institut té constància escrita del consentiment familiar.": "Использование мобильных телефонов учащимися запрещено во всех помещениях школы и во всех образовательных мероприятиях вне школы. Наличие устройства возможно только если оно полностью выключено при входе в школу и если у школы есть письменное согласие семьи.",
    "Aquestes indicacions també s'han de complir en activitats fora del centre: sortides, colònies, viatges, projectes compartits, activitats amb famílies o comunitat educativa, extraescolars i activitats amb entitats de l'entorn.": "Эти указания также должны соблюдаться на мероприятиях вне школы: экскурсиях, лагерях, поездках, совместных проектах, мероприятиях с семьями или образовательным сообществом, внеклассных мероприятиях и мероприятиях с местными организациями.",
    "Estudis postobligatoris": "Постобязательное образование",
    "L'alumnat d'estudis postobligatoris ha de fer un ús responsable dels dispositius mòbils i vincular-los a les activitats d'aprenentatge quan el professorat ho indiqui.": "Учащиеся постобязательных программ должны ответственно использовать мобильные устройства и связывать их с учебной деятельностью, когда это указывает преподаватель.",
    "Excepcionalitats": "Исключения",
    "Salut: es permet utilitzar un dispositiu quan l'alumnat tingui una necessitat específica per motius de salut.": "Здоровье: устройство можно использовать, когда у учащегося есть особая потребность по состоянию здоровья.",
    "NESE: es permet utilitzar un dispositiu quan sigui necessari per facilitar l'accés a l'aprenentatge, la participació o la comunicació.": "NESE: устройство можно использовать, когда оно необходимо для доступа к обучению, участия или коммуникации.",
    "Emergències: en una situació d'emergència, l'alumnat pot utilitzar el telèfon mòbil per comunicar-se amb la família.": "Чрезвычайные ситуации: в чрезвычайной ситуации учащийся может использовать мобильный телефон для связи с семьей.",
    "Mesures correctores i sancions": "Корректирующие меры и санкции",
    "L'ús del telèfon mòbil sense consentiment previ d'un docent pot constituir una falta lleu si no afecta drets fonamentals o protecció de dades.": "Использование мобильного телефона без предварительного разрешения преподавателя может считаться легким нарушением, если не затрагивает основные права или защиту данных.",
    "L'ús que vulneri drets fonamentals pot constituir una falta greument perjudicial per a la convivència i comportar expedient disciplinari.": "Использование, нарушающее основные права, может считаться серьезным нарушением сосуществования и повлечь дисциплинарное производство.",
    "Si un alumne/a es nega a lliurar el telèfon quan se li demana, es considera falta molt greu.": "Если учащийся отказывается передать телефон по требованию, это считается очень серьезным нарушением.",
    "L'institut no es fa responsable de desperfectes o robatoris. Les famílies i l'alumnat han de conèixer aquesta normativa, i qualsevol professor/a pot comprovar que el telèfon està completament apagat.": "Школа не несет ответственности за повреждения или кражи. Семьи и учащиеся должны знать эти правила, и любой преподаватель может проверить, что телефон полностью выключен.",
    "Només es considera realment apagat si l'accés a qualsevol aplicació necessita que el dispositiu iniciï el sistema operatiu. No ho són el bloqueig de pantalla, el mode avió, el mode rellotge o estats equivalents.": "Телефон считается действительно выключенным только если для доступа к любому приложению устройство должно загрузить операционную систему. Блокировка экрана, режим полета, режим часов или аналогичные состояния не считаются выключением.",
    "En cas d'ús de telèfon mòbil sense consentiment familiar o sense complir la normativa, s'aplicaran les mesures disciplinàries corresponents.": "В случае использования мобильного телефона без согласия семьи или без соблюдения правил будут применяться соответствующие дисциплинарные меры.",
    "Consentiment sobre la tinència de telèfon mòbil al centre": "Согласие на наличие мобильного телефона в школе",
    "NO DONO EL MEU CONSENTIMENT a què el meu fill/a porti telèfon mòbil, atenent-me a la normativa aquí descrita.": "Я НЕ ДАЮ СОГЛАСИЯ на то, чтобы мой ребенок приносил мобильный телефон, с учетом описанных здесь правил.",
    "DONO EL MEU CONSENTIMENT PARTICULAR a què el meu fill/a porti telèfon mòbil al centre, atenent-me a la normativa aquí descrita.": "Я ДАЮ ОСОБОЕ СОГЛАСИЕ на то, чтобы мой ребенок приносил мобильный телефон в школу, с учетом описанных здесь правил.",
    "8. Lloc, data i signatures": "8. Место, дата и подписи",
    "Carregant": "загрузка",
    "Preparant el formulari...": "Готовим форму...",
    "2. Autoritzacions per a l’estada de l’alumnat al centre": "2. Разрешения студентам на пребывание в центре.",
    "Informació bàsica sobre protecció de dades personals": "Основная информация о защите персональных данных",
    "Responsable: direcció del centre educatiu, de titularitat del Departament d’Educació i Formació Professional.": "Ответственные: руководство образовательного центра, находящегося в собственности Департамента образования и профессионального обучения.",
    "Finalitat: la funció educativa i la gestió de la permanència i la sortida de l’alumnat del centre. L’atenció de les necessitats sanitàries de l’alumnat.": "Назначение: воспитательная функция и управление пребыванием и выездом обучающихся из центра. Внимание к потребностям здоровья студентов.",
    "Drets: es poden exercir els drets d’accés, rectificació, supressió, limitació del tractament, oposició i la resta de drets previstos per la normativa vigent davant la direcció del centre educatiu. També es pot presentar una reclamació davant l’Autoritat Catalana de Protecció de Dades.": "Права: вы можете воспользоваться правами доступа, исправления, удаления, ограничения обращения, возражения и остальными правами, предусмотренными действующими правилами перед руководством образовательного центра. Претензию также можно подать в Управление по защите данных Каталонии.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Alumnes de centres educatius de titularitat del Departament d’Educació i Formació Professional.": "Дополнительную информацию об этом лечении можно получить на веб-сайте Департамента (educacio.gencat.cat), в разделе Департамент > Защита данных > Учет лечебной деятельности > Алфавитный список > Студенты образовательных центров, принадлежащих Департаменту образования и профессиональной подготовки.",
    "Autoritzo, com a responsable legal de l’alumne/a:": "Я как законный опекун учащегося разрешаю:",
    "Sortida amb/sense acompanyament del centre fora de l’horari lectiu (d’acord amb les normes d’organització i funcionament del centre, NOFC, aprovades pel consell escolar del centre)": "Уход из центра с/без сопровождения во внеучебное время (в соответствии с правилами организации и деятельности центра НОФК, утвержденными школьным советом центра)",
    "Que l’alumne/a marxi del centre fora de l’horari lectiu acompanyat/ada per les persones següents (un cop s’hagin acreditat documentalment):": "Учащийся покидает центр во внеурочное время в сопровождении следующих людей (после получения документов):",
    "3. Publicacions: protecció de dades i propietat intel·lectual": "3. Публикации: защита данных и интеллектуальная собственность",
    "La publicació d’imatges/veu i del material elaborat és opcional i no condiciona l’activitat lectiva. El consentiment és revocable i sense efectes retroactius.": "Публикация изображений/голоса и подготовленного материала не является обязательной и не обусловливает педагогическую деятельность. Согласие является отзывным и не имеет обратной силы.",
    "Finalitat: la gestió de la difusió i conservació del material elaborat per l’alumnat, i l’ús de la imatge i veu en espais de comunicació digitals.": "Цель: управление распространением и сохранением материалов, созданных студентами, а также использование изображения и голоса в цифровых коммуникационных пространствах.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Publicació d’imatges i veu en els espais de comunicació i difusió dels serveis educatius.": "Дополнительную информацию об этом лечении можно найти на веб-сайте Департамента (educacio.gencat.cat), в разделе Департамент > Защита данных > Запись о лечебной деятельности > Алфавитный список > Публикация изображений и голоса в сфере коммуникации и распространения образовательных услуг.",
    "Ús d’imatges, publicació de dades de caràcter personal i material elaborat": "Использование изображений, публикация персональных данных и подготовленного материала",
    "1. La publicació de la imatge/veu de l’alumne/a en activitats del centre:": "1. Публикация образа/голоса студента в деятельности центра:",
    "— Intranet amb accés restringit (plataformes del centre: Moodle/Àgora, Google Workspace, etc.):": "— Интранет с ограниченным доступом (центральные платформы: Moodle/Àgora, Google Workspace и др.):",
    "— Internet amb accés obert (web, blogs del centre):": "— Интернет с открытым доступом (веб, центральные блоги):",
    "— Plataformes no administrades pel centre (YouTube, Instagram, altres —especifiqueu-les—):": "— Платформы, не администрируемые центром (YouTube, Instagram, другие — уточните —):",
    "Plataformes/Accés:": "Платформы/Доступ:",
    "2. La publicació de les inicials de l’alumne/a i del centre:": "2. Публикация инициалов студента и центра:",
    "Publicació i preservació d’obres i creacions": "Публикация и сохранение произведений и творений",
    "1. La publicació del material que elabori l’alumne/a (treball de síntesi, projecte de recerca, obra final, etc.) a plataformes d’accés obert:": "1. Публикация подготовленного обучающимся материала (обобщающей работы, научно-исследовательского проекта, выпускной работы и т.п.) на платформах открытого доступа:",
    "2. La publicació de l’obra que elabori l’alumne/a en espais de comunicació del centre (web, blogs, revistes, xarxes gestionades pel centre):": "2. Публикация произведенной студентом работы в коммуникационных пространствах центра (сети, блоги, журналы, сети, управляемые центром):",
    "3. La preservació/desament de l’obra:": "3. Сохранение/сохранение произведения:",
    "— A la biblioteca física o digital del centre:": "— В физической или цифровой библиотеке центра:",
    "— Al repositori del Departament:": "— В репозитории Департамента:",
    "Actuacions necessàries per a la publicació i el desament (si escau):": "Действия, необходимые для публикации и сохранения (если применимо):",
    "La publicació i el desament d’obres originals es regeixen pel Reial decret legislatiu 1/1996 (Llei de propietat intel·lectual). El consentiment és revocable i la revocació no té efectes retroactius.": "Публикация и хранение оригинальных произведений регулируются Королевским законодательным декретом 1/1996 (Закон об интеллектуальной собственности). Согласие является отзывным, и отзыв не имеет обратной силы.",
    "Les autoritzacions de consentiment (imatges/obres) són vàlides fins a la seva modificació o revocació. Les comunicacions i autoritzacions organitzatives s’apliquen durant l’escolarització, amb possibilitat de modificar-les si canvien les circumstàncies familiars.": "Разрешения на получение согласия (изображения/работы) действительны до тех пор, пока не будут изменены или отозваны. Организационные связи и разрешения применяются во время обучения с возможностью их изменения в случае изменения семейных обстоятельств.",
    "4. Autoritzacions per utilitzar plataformes i eines digitals": "4. Разрешения на использование цифровых платформ и инструментов.",
    "Finalitat: gestionar l’activitat educativa mitjançant les plataformes digitals que el Departament habilita per a l’alumnat. Entre d’altres, crear i gestionar comptes d’usuari per accedir a les eines de cada plataforma amb l’objectiu de facilitar l’aprenentatge digital i l’adquisició de competències digitals, seguint el currículum educatiu.": "Цель: управлять образовательной деятельностью посредством цифровых платформ, которые кафедра предоставляет студентам. Среди прочего, создавайте и управляйте учетными записями пользователей для доступа к инструментам каждой платформы с целью облегчения цифрового обучения и приобретения цифровых навыков в соответствии с образовательной программой.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica >Plataformes i eines digitals educatives dels centres educatius": "Дополнительную информацию об этом лечении вы можете получить на сайте Департамента (educacio.gencat.cat), в Департаменте > Защита данных > Учет лечебных мероприятий > Алфавитный список > Цифровые образовательные платформы и инструменты образовательных центров.",
    "Comunicació sobre l’ús de plataformes i eines digitals en l’àmbit educatiu": "Коммуникация по использованию цифровых платформ и инструментов в образовательной сфере",
    "1. Informació sobre les plataformes digitals": "1. Информация о цифровых платформах",
    "El centre educatiu utilitza plataformes i eines digitals habilitades pel Departament d’Educació i Formació Professional, o autoritzades institucionalment per a finalitats educatives i professionals, per facilitar el desenvolupament de l’activitat educativa, docent i organitzativa del centre i contribuir a l’assoliment de les competències digitals incloses en el currículum educatiu vigent, tant en l’escolarització obligatòria com en la postobligatòria, d’acord amb la normativa vigent.": "Образовательный центр использует цифровые платформы и инструменты, предоставленные Департаментом образования и профессиональной подготовки или институционально уполномоченные для образовательных и профессиональных целей, чтобы способствовать развитию образовательной, педагогической и организационной деятельности центра и способствовать достижению цифровых навыков, включенных в действующую образовательную программу, как в обязательном, так и в послеобязательном школьном образовании, в соответствии с действующими правилами.",
    "Les eines i plataformes que es poden utilitzar són:": "Инструменты и платформы, которые можно использовать:",
    "Google Workspace for Education": "Google Workspace для образования",
    "Microsoft 365 Educació": "Microsoft 365 для образования",
    "Moodle": "Мудл",
    "Altres eines i serveis digitals amb finalitats educatives autoritzats pel Departament d’Educació i Formació Professional o pel centre educatiu": "Другие цифровые инструменты и услуги для образовательных целей, разрешенные Департаментом образования и профессионального обучения или образовательным центром.",
    "Aquestes plataformes ofereixen entorns virtuals d’aprenentatge, eines de comunicació, treball col·laboratiu, videoconferència, emmagatzematge i gestió acadèmica que donen suport a les activitats docents, educatives i organitzatives del centre.": "Эти платформы предлагают виртуальную среду обучения, инструменты коммуникации, совместную работу, видеоконференции, хранение и академический менеджмент, которые поддерживают преподавательскую, образовательную и организационную деятельность центра.",
    "L’ús d’aquestes eines comporta la creació i gestió de comptes corporatius del professorat dins dels entorns digitals educatius institucionals.": "Использование этих инструментов предполагает создание и управление корпоративными учетными записями учителей в институциональной цифровой образовательной среде.",

<script>
// Inicialització de la interfície multilingüe.
window.addEventListener('DOMContentLoaded', () => {
  const initialData = window.INITIAL_FORM_DATA || {};
  I18n.init({ defaultLanguage: initialData.idioma_formulari || 'ca', storageKey: 'autoritzacionsIdioma' });
  setupRespondentStep();
  setupAuthorizedPeopleVisibility();
  setupAcademicContactDependency();
  setupExternalPlatformsDependency();
  fillForm(initialData);
  renderDebugContext(initialData);
  applyFormMode(initialData);
  if (initialData.__async_initial_payload) {
    loadResolvedInitialData(initialData.__async_initial_payload);
  } else {
    hideFormLoading();
  }
});

const form = document.getElementById('authorizationForm');
const SUCCESS_REDIRECT_URL = 'https://agora.xtec.cat/sesernestlluch-cunit/';
const DEFAULT_EXTERNAL_PLATFORMS = 'YouTube, Instagram, altres...';
let currentFormMode = '';
let verifiedLaunchContext = {};
let personCounter = 0;
const typeConfig = {
  eso_menor14: {code:'A1746-V01-26', subtitle:"Escolarització de l'alumnat menor de catorze anys", responsible:true, studentSignature:false, esoExit:true, recess:false, unforeseenExit:false, academic:false, municipal:true, healthConsent:false, paracetamol:true, tis:true},
  eso_14_17: {code:'A1747-V01-26', subtitle:"Escolarització de l'alumnat de catorze a disset anys", responsible:true, studentSignature:true, esoExit:true, recess:false, unforeseenExit:false, academic:false, municipal:true, healthConsent:false, paracetamol:true, tis:false},
  batx_menor18: {code:'A1749-V01-26', subtitle:"Escolarització de l'alumnat de batxillerat menor de divuit anys", responsible:true, studentSignature:true, esoExit:false, recess:true, unforeseenExit:true, academic:false, municipal:true, healthConsent:true, paracetamol:false, tis:false},
  post_menor18: {code:'A1748-V01-26', subtitle:"Escolarització de l'alumnat d'ensenyaments postobligatoris menor de divuit anys", responsible:true, studentSignature:true, esoExit:false, recess:true, unforeseenExit:true, academic:false, municipal:true, healthConsent:true, paracetamol:false, tis:false},
  major18: {code:'A1750-V01-26', subtitle:"Escolarització de l'alumnat major de divuit anys", responsible:false, studentSignature:true, esoExit:false, recess:false, unforeseenExit:true, academic:true, municipal:false, healthConsent:true, paracetamol:false, tis:false}
};

const modelLabels = {
  eso_menor14: 'ESO — menor de 14 anys',
  eso_14_17: 'ESO — de 14 a 17 anys',
  batx_menor18: 'Batxillerat — menor de 18 anys',
  post_menor18: 'FP / altres postobligatoris — menor de 18 anys',
  major18: 'Alumnat major de 18 anys'
};

function selectModelFromSetup() {
  const studies = document.getElementById('studyType').value;
  const adult = document.getElementById('isAdult').value;
  const age14 = document.getElementById('is14Plus').value;
  const ageWrap = document.getElementById('age14Wrapper');
  const message = document.getElementById('modelSelectionMessage');
  ageWrap.classList.toggle('is-hidden', studies !== 'eso' || adult === 'si');

  let model = '';
  if (adult === 'si') model = 'major18';
  else if (adult === 'no' && studies === 'batx') model = 'batx_menor18';
  else if (adult === 'no' && studies === 'fp') model = 'post_menor18';
  else if (adult === 'no' && studies === 'eso' && age14 === 'si') model = 'eso_14_17';
  else if (adult === 'no' && studies === 'eso' && age14 === 'no') model = 'eso_menor14';

  document.querySelectorAll('[name="tipus_alumne"]').forEach(r => r.checked = r.value === model);
  if (model) {
    message.textContent = 'Model seleccionat: ' + modelLabels[model];
    message.classList.remove('is-hidden');
    applyType();
  } else {
    message.classList.add('is-hidden');
  }
}
['studyType','isAdult','is14Plus'].forEach(id => document.getElementById(id).addEventListener('change', selectModelFromSetup));

function setSetupFromModel(model) {
  if (!model) return;
  const studies = model.startsWith('eso_') ? 'eso' : model.startsWith('batx_') ? 'batx' : model.startsWith('post_') ? 'fp' : '';
  document.getElementById('studyType').value = studies;
  document.getElementById('isAdult').value = model === 'major18' ? 'si' : 'no';
  document.getElementById('is14Plus').value = model === 'eso_14_17' ? 'si' : model === 'eso_menor14' ? 'no' : '';
  selectModelFromSetup();
}



function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function renderDebugContext(data) {
  if (!data || !data.__debug_context) return;
  const box = document.createElement('pre');
  box.style.cssText = 'position:relative;z-index:10000;margin:12px auto;padding:12px;border:1px solid #f59e0b;background:#fff7ed;color:#7c2d12;white-space:pre-wrap;width:min(920px,calc(100% - 24px));font:12px/1.4 monospace;';
  box.textContent = 'DEBUG FORM CONTEXT\\n' + JSON.stringify(data.__debug_context, null, 2);
  document.body.insertBefore(box, document.body.firstChild);
}
function setBlock(id, show) { const el=document.getElementById(id); el.classList.toggle('is-hidden', !show); el.querySelectorAll('input,select,textarea').forEach(x=>x.disabled=!show); }

function addAuthorizedPerson(data={}) {
  if (personCounter >= 8) return;
  personCounter++;
  const row=document.createElement('div'); row.className='row g-2 align-items-end authorized-person';
  row.innerHTML=`<div class="col-md-6"><label class="form-label small">Nom i cognoms</label><input class="form-control" name="persona_autoritzada_nom_${personCounter}" value="${escapeHtml(data.nom||'')}"></div><div class="col-md-5"><label class="form-label small">En qualitat de</label><input class="form-control" name="persona_autoritzada_qualitat_${personCounter}" value="${escapeHtml(data.qualitat||'')}"></div><div class="col-md-1 no-print"><button class="btn btn-outline-danger w-100" type="button" aria-label="Elimina persona">×</button></div>`;
  row.querySelector('button').addEventListener('click',()=>row.remove()); document.getElementById('authorizedPeople').appendChild(row);
}
document.getElementById('addPerson').addEventListener('click',()=>addAuthorizedPerson());


function clearAuthorizedPeople() {
  document.getElementById('authorizedPeople').textContent = '';
  personCounter = 0;
}

function setAuthorizedPeopleVisible(show) {
  const block = document.getElementById('authorizedPeopleBlock');
  block.classList.toggle('is-hidden', !show);
  block.querySelectorAll('input,select,textarea,button').forEach(field => field.disabled = !show);
  if (show && !document.querySelector('.authorized-person')) addAuthorizedPerson();
  if (!show) clearAuthorizedPeople();
}

function setupAuthorizedPeopleVisibility() {
  document.querySelectorAll('[name="sortida_sola"]').forEach(input => {
    input.addEventListener('change', () => setAuthorizedPeopleVisible(document.getElementById('sortidaSolaNo').checked));
  });
  setAuthorizedPeopleVisible(document.getElementById('sortidaSolaNo').checked);
}

function setAcademicContactVisible(show) {
  const block = document.getElementById('academicContactDetails');
  block.classList.toggle('is-hidden', !show);
  block.querySelectorAll('input,select,textarea').forEach(field => {
    field.disabled = !show;
    if (!show) {
      if (field.type === 'radio' || field.type === 'checkbox') field.checked = false;
      else field.value = '';
    }
  });
}

function setupAcademicContactDependency() {
  document.querySelectorAll('[name="comunicacio_academica"]').forEach(input => {
    input.addEventListener('change', () => setAcademicContactVisible(document.getElementById('comAcadSi').checked));
  });
  setAcademicContactVisible(document.getElementById('comAcadSi').checked);
}

function setExternalPlatformsVisible(show) {
  const block = document.getElementById('externalPlatformsDetail');
  const input = document.getElementById('plataformesExternes');
  block.classList.toggle('is-hidden', !show);
  input.disabled = !show;
  if (show && !input.value.trim()) input.value = DEFAULT_EXTERNAL_PLATFORMS;
  if (!show) input.value = '';
}

function setupExternalPlatformsDependency() {
  document.querySelectorAll('[name="imatge_externa"]').forEach(input => {
    input.addEventListener('change', () => setExternalPlatformsVisible(document.getElementById('imatgeExternaSi').checked));
  });
  setExternalPlatformsVisible(document.getElementById('imatgeExternaSi').checked);
}

function applyType() {
  const type=form.querySelector('[name="tipus_alumne"]:checked')?.value;
  const cfg=typeConfig[type];
  if(!cfg) return;
  document.getElementById('documentSubtitle').textContent=cfg.subtitle;
  document.getElementById('documentCode').value=cfg.code;
  document.getElementById('documentCodeText').textContent=cfg.code;
  document.getElementById('alumneDocLabel').textContent=cfg.tis?'DNI/NIE/Passaport/TIS':'DNI/NIE/Passaport';
  setBlock('responsableFields',cfg.responsible);
  document.getElementById('responsableNom').required=cfg.responsible;
  setBlock('esoExitBlock',cfg.esoExit);
  setBlock('recessExitBlock',cfg.recess);
  setBlock('unforeseenExitBlock',cfg.unforeseenExit);
  setBlock('academicCommunicationBlock',cfg.academic);
  setAcademicContactVisible(cfg.academic && document.getElementById('comAcadSi').checked);
  setBlock('municipalTripsBlock',cfg.municipal);
  setBlock('healthCommunicationBlock',cfg.healthConsent);
  setBlock('paracetamolBlock',cfg.paracetamol);
  document.getElementById('signatureResponsibleData').value=cfg.responsible?'true':'false';
  document.getElementById('signatureStudentData').value='false';
}
document.querySelectorAll('[name="tipus_alumne"]').forEach(x=>x.addEventListener('change',()=>{applyType();setSetupFromModel(x.value);}));
document.getElementById('alumneNom').addEventListener('input', updateStudentBanner);

function hideFormLoading() {
  document.getElementById('formLoadingOverlay')?.classList.add('is-hidden');
}

function loadResolvedInitialData(payload) {
  google.script.run
    .withSuccessHandler(result => {
      if (!result || result.ok !== true) {
        if (result && result.html) {
          document.open();
          document.write(result.html);
          document.close();
          return;
        }
        throw new Error('No s ha pogut preparar el formulari.');
      }
      window.INITIAL_FORM_DATA = result.data || {};
      fillForm(result.data || {});
      applyFormMode(result.data || {});
      hideFormLoading();
    })
    .withFailureHandler(error => {
      document.body.innerHTML = '<main style="width:min(760px,calc(100% - 32px));margin:36px auto;background:#fff;border:1px solid #d9e0e8;border-radius:8px;padding:30px;font-family:Arial,sans-serif"><h1 style="color:#b42318">No s ha pogut obrir el formulari</h1><p>S ha produït un error. Si el problema continua, poseu-vos en contacte amb el centre.</p></main>';
    })
    .resolveInitialFormData(payload);
}

function rememberLaunchContext(data) {
  const source = data || {};
  const keys = ['form_mode','mode','launcher_token','form_session','verified_actor_type','verified_dinantia_account_id','verified_email','resposta_id','id_student'];
  keys.forEach(key => {
    const value = source[key];
    if (value !== undefined && value !== null && String(value).trim() !== '') verifiedLaunchContext[key] = String(value).trim();
  });
  if (!verifiedLaunchContext.form_mode && verifiedLaunchContext.mode) verifiedLaunchContext.form_mode = verifiedLaunchContext.mode;
}

function ensureLaunchContextPayload(out) {
  rememberLaunchContext(window.INITIAL_FORM_DATA || {});
  if (!out.form_mode) out.form_mode = verifiedLaunchContext.form_mode || verifiedLaunchContext.mode || '';
  ['launcher_token','form_session','verified_actor_type','verified_dinantia_account_id','verified_email','resposta_id','id_student'].forEach(key => {
    if (!out[key] && verifiedLaunchContext[key]) out[key] = verifiedLaunchContext[key];
  });
}

function formToObject(){ updateSignatureFields(); if(document.getElementById('imatgeExternaSi').checked&&!document.getElementById('plataformesExternes').value.trim()) document.getElementById('plataformesExternes').value=DEFAULT_EXTERNAL_PLATFORMS; const out={}; for(const [k,v] of new FormData(form).entries()) out[k]=v; out.curs_inici=document.getElementById('cursInici').value; out.curs_fi=document.getElementById('cursFi').value; out.idioma_formulari=I18n.currentLanguage||'ca'; out.form_mode=currentFormMode||document.getElementById('formMode').value||''; out.isAdult=document.getElementById('isAdult').value; out.is14Plus=document.getElementById('is14Plus').value; ensureLaunchContextPayload(out); if(out.verified_actor_type==='student'&&out.isAdult==='si') out.signatura_alumne='true'; return out; }
function forceStudentModel(model) {
  if (!model || !typeConfig[model]) return;
  document.querySelectorAll('[name="tipus_alumne"]').forEach(r => r.checked = r.value === model);
  setSetupFromModel(model);
  applyType();
}

function isAdultStudentSubmission(data) {
  const payload = data || {};
  const mode = String(payload.form_mode || payload.mode || currentFormMode || document.getElementById('formMode').value || '').trim();
  const model = String(payload.tipus_alumne || form.querySelector('[name="tipus_alumne"]:checked')?.value || '').trim();
  const actor = String(payload.verified_actor_type || document.getElementById('verifiedActorType').value || '').trim();
  const adult = String(payload.isAdult || document.getElementById('isAdult').value || '').trim();
  return mode === 'new_student_adult' || model === 'major18' || (actor === 'student' && adult === 'si');
}

function syncAdultStudentRespondent(data) {
  if (!isAdultStudentSubmission(data)) return;
  forceStudentModel('major18');
  const studentName = document.getElementById('alumneNom').value.trim();
  if (studentName && !document.getElementById('hiddenRespondentName').value.trim()) {
    document.getElementById('hiddenRespondentName').value = studentName;
  }
}

function normalizeStoredChoice(value) {
  if (value === true) return 'si';
  if (value === false) return 'no';
  const text = String(value === null || value === undefined ? '' : value).trim().toLowerCase();
  if (['true','si','sí','1','acceptada','on'].includes(text)) return 'si';
  if (['false','no','0'].includes(text)) return 'no';
  return String(value === null || value === undefined ? '' : value);
}

function normalizeDateInputValue(value) {
  if (!value) return '';
  if (value instanceof Date && !Number.isNaN(value.getTime())) return value.toISOString().slice(0, 10);
  const text = String(value).trim();
  const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  const local = text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if (local) return `${local[3]}-${local[2].padStart(2, '0')}-${local[1].padStart(2, '0')}`;
  return text;
}

function fillForm(data){
  rememberLaunchContext(data);
  Object.keys(data||{}).filter(key=>/^persona_autoritzada_nom_\d+$/.test(key)).sort((a,b)=>Number(a.match(/\d+$/)[0])-Number(b.match(/\d+$/)[0])).forEach(key=>{
    const index=key.match(/\d+$/)[0];
    addAuthorizedPerson({nom:data[key]||'', qualitat:data['persona_autoritzada_qualitat_'+index]||''});
  });
  Object.entries(data||{}).forEach(([key,value])=>{
    if(key==='curs_inici'||key==='curs_fi'){document.getElementById(key==='curs_inici'?'cursInici':'cursFi').value=value;return;}
    if(key==='studyType'||key==='isAdult'||key==='is14Plus'){document.getElementById(key).value=value;return;}
    if(key==='id_student'){document.getElementById('idStudent').value=value;return;}
    if(key==='form_mode'||key==='mode'){document.getElementById('formMode').value=value;currentFormMode=value;return;}
    if(key==='resposta_id'){document.getElementById('responseId').value=value;return;}
    if(key==='verified_actor_type'){document.getElementById('verifiedActorType').value=value;return;}
    if(key==='verified_dinantia_account_id'){document.getElementById('verifiedDinantiaAccountId').value=value;return;}
    if(key==='verified_email'){document.getElementById('verifiedEmail').value=value;return;}
    if(key==='launcher_token'){document.getElementById('launcherToken').value=value;return;}
    if(key==='form_session'){document.getElementById('formSession').value=value;return;}
    if(key==='responent_nom_sencer'){document.getElementById('responentNomSencer').value=value;document.getElementById('hiddenRespondentName').value=value;}
    if(key==='responent_telefon'){document.getElementById('responentTelefon').value=value;document.getElementById('hiddenRespondentPhone').value=value;}
    if(/^persona_autoritzada_/.test(key)) return;
    form.querySelectorAll(`[name="${CSS.escape(key)}"]`).forEach(field=>{
      if(field.type==='radio') field.checked=field.value===normalizeStoredChoice(value);
      else if(field.type==='checkbox') field.checked=normalizeStoredChoice(value)==='si';
      else if(field.type==='date') field.value=normalizeDateInputValue(value);
      else if(!key.startsWith('signatura_')) field.value=value;
    });
  });
  selectModelFromSetup();
  if(data.tipus_alumne) setSetupFromModel(data.tipus_alumne);
  setAuthorizedPeopleVisible(document.getElementById('sortidaSolaNo').checked);
  setAcademicContactVisible(document.getElementById('comAcadSi').checked);
  setExternalPlatformsVisible(document.getElementById('imatgeExternaSi').checked);
  updateStudentBanner();
  syncAdultStudentRespondent(data);
}

function updateStudentBanner() {
  const name = document.getElementById('alumneNom').value.trim();
  document.getElementById('studentBannerName').textContent = name;
  document.getElementById('studentBanner').classList.toggle('is-hidden', !name);
}

document.getElementById('saveLocal')?.addEventListener('click',()=>{localStorage.setItem('autoritzacionsForm5Models',JSON.stringify(formToObject()));alert('Formulari desat en aquest navegador.');});
document.getElementById('loadLocal')?.addEventListener('click',()=>{const raw=localStorage.getItem('autoritzacionsForm5Models');if(!raw)return alert('No hi ha cap còpia desada.');fillForm(JSON.parse(raw));});
document.getElementById('downloadJson')?.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(formToObject(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`autoritzacions_${document.getElementById('alumneNom').value.trim().replace(/\s+/g,'_')||'formulari'}.json`;a.click();URL.revokeObjectURL(a.href);});
form.addEventListener('submit',e=>{
  e.preventDefault();
  e.stopPropagation();
  form.classList.add('was-validated');
  if(!validateInitialSetup()) return;
  syncRequiredFields();
  clearValidationUi();
  if(!form.checkValidity()){
    showValidationErrors();
    return;
  }
  submitForm();
});

form.addEventListener('input', () => {
  if (!form.classList.contains('was-validated')) return;
  syncRequiredFields();
  clearValidationUi();
});

form.addEventListener('change', () => {
  if (!form.classList.contains('was-validated')) return;
  syncRequiredFields();
  clearValidationUi();
});

function validateInitialSetup() {
  const selectedModel = form.querySelector('[name="tipus_alumne"]:checked');
  if (document.getElementById('initialSetup').classList.contains('is-hidden') && selectedModel) return true;
  const fields = ['studyType', 'isAdult'];
  if (!document.getElementById('age14Wrapper').classList.contains('is-hidden')) fields.push('is14Plus');
  const invalid = fields.map(id => document.getElementById(id)).filter(field => !field.value);
  if (!invalid.length && selectedModel) return true;
  showValidationSummary([{
    section: I18n.t('Configuració inicial'),
    label: I18n.t('Completa la configuració inicial per seleccionar el model aplicable.'),
    field: invalid[0] || document.getElementById('studyType')
  }]);
  (invalid[0] || document.getElementById('studyType')).focus();
  return false;
}

function isFormFieldRequired(field) {
  if (!field || field.disabled) return false;
  if (field.type === 'hidden' || field.type === 'button' || field.type === 'submit' || field.type === 'reset') return false;
  if (field.closest('.is-hidden')) return false;
  if (field.closest('.optional-question')) return false;
  return Boolean(field.closest('#authorizationForm'));
}

function syncRequiredFields() {
  const fields = [...form.querySelectorAll('input,select,textarea')];
  fields.forEach(field => {
    field.setCustomValidity('');
    field.required = isFormFieldRequired(field);
    if (!field.required) return;
    const value = String(field.value || '').trim();
    if (field.type === 'tel' && value && !isValidPhone(value)) {
      field.setCustomValidity(I18n.t('Introdueix un telèfon vàlid.'));
    }
  });
}

function clearValidationUi() {
  document.getElementById('validationSummary')?.classList.add('is-hidden');
  document.querySelectorAll('.field-validation-message').forEach(node => node.remove());
  document.querySelectorAll('.has-validation-error').forEach(node => node.classList.remove('has-validation-error'));
}

function showValidationErrors() {
  const invalidFields = getInvalidFields();
  const items = invalidFields.map(field => ({
    section: getFieldSectionTitle(field),
    label: getFieldLabel(field),
    message: getFieldValidationMessage(field),
    field
  }));
  items.forEach(item => showFieldValidationMessage(item));
  showValidationSummary(items);
  openAccordionForField(items[0]?.field);
  setTimeout(() => {
    const first = items[0]?.field;
    if (first) first.focus({preventScroll:true});
    items[0]?.field?.scrollIntoView({behavior:'smooth', block:'center'});
  }, 160);
}

function getInvalidFields() {
  const fields = [...form.querySelectorAll('input,select,textarea')].filter(field => !field.disabled && !field.checkValidity());
  const seen = new Set();
  return fields.filter(field => {
    const key = field.type === 'radio' ? 'radio:' + field.name : field.name || field.id;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function getFieldSectionTitle(field) {
  return field.closest('.accordion-item')?.querySelector('.accordion-button')?.textContent.trim() || I18n.t('Formulari');
}

function getFieldLabel(field) {
  const explicit = field.id ? document.querySelector(`label[for="${CSS.escape(field.id)}"]`) : null;
  if (explicit) return explicit.textContent.trim();
  if (field.type === 'radio') {
    const groupLabel = field.closest('.question')?.querySelector('.form-label, h3, h4, p, .option-label');
    if (groupLabel) return groupLabel.textContent.trim();
  }
  const parentLabel = field.closest('label');
  if (parentLabel) return parentLabel.textContent.trim();
  return field.name || I18n.t('Camp del formulari');
}

function getFieldValidationMessage(field) {
  if (field.validity.valueMissing) return field.type === 'radio' ? I18n.t('Selecciona una opció.') : I18n.t('Camp obligatori.');
  if (field.type === 'email' && field.validity.typeMismatch) return I18n.t('Introdueix un correu electrònic vàlid.');
  if (field.type === 'tel' && field.validity.customError) return I18n.t('Introdueix un telèfon vàlid.');
  return field.validationMessage || I18n.t('Completa aquest camp correctament.');
}

function getValidationContainer(field) {
  if (field.type === 'radio') return field.closest('.option-row, .question, .col-12, .col-md-4, .col-md-6') || field.parentElement;
  return field.closest('.col-12, .col-md-8, .col-md-6, .col-md-4, .col-md-2, .dependent-field, .question') || field.parentElement;
}

function showFieldValidationMessage(item) {
  const question = item.field.closest('.question');
  question?.classList.add('has-validation-error');
  const container = getValidationContainer(item.field);
  const message = document.createElement('div');
  message.className = 'field-validation-message';
  message.textContent = item.message;
  container.appendChild(message);
}

function showValidationSummary(items) {
  const summary = document.getElementById('validationSummary');
  if (!summary) return;
  const visibleItems = items.length ? items : [{section:I18n.t('Formulari'), label:I18n.t('Completa aquest camp correctament.')}];
  summary.innerHTML = `<strong>${escapeHtml(I18n.t('Revisa el formulari'))}</strong><div>${escapeHtml(I18n.t('Hi ha preguntes obligatòries pendents o amb un format incorrecte.'))}</div><ul>${visibleItems.map(item => `<li>${escapeHtml(item.section)}: ${escapeHtml(item.label)}</li>`).join('')}</ul>`;
  summary.classList.remove('is-hidden');
  summary.focus();
}

function openAccordionForField(field) {
  const collapse = field?.closest('.accordion-collapse');
  if (!collapse) return;
  if (window.bootstrap?.Collapse) {
    window.bootstrap.Collapse.getOrCreateInstance(collapse, {toggle:false}).show();
  } else {
    collapse.classList.add('show');
  }
}

function setupRespondentStep(){
  document.getElementById('respondentNext').addEventListener('click',()=>{
    const name=document.getElementById('responentNomSencer').value.trim();
    const phone=document.getElementById('responentTelefon').value.trim();
    const error=document.getElementById('respondentError');
    error.classList.add('is-hidden');
    if(!name||!phone||!isValidPhone(phone)){
      error.textContent='Indica el nom sencer i un telèfon vàlid per continuar.';
      error.classList.remove('is-hidden');
      return;
    }
    document.getElementById('hiddenRespondentName').value=name;
    document.getElementById('hiddenRespondentPhone').value=phone;
    document.getElementById('respondentStep').classList.add('is-hidden');
    document.getElementById('initialSetup').classList.remove('is-hidden');
    form.classList.remove('is-hidden');
  });
}

function applyFormMode(data) {
  currentFormMode = data.form_mode || data.mode || currentFormMode || '';
  const skipRespondent = ['edit_owner','readonly','readonly_print','student_confirm'].includes(currentFormMode) || isAdultStudentSubmission(data);
  if (skipRespondent) {
    document.getElementById('respondentStep').classList.add('is-hidden');
    document.getElementById('initialSetup').classList.add('is-hidden');
    form.classList.remove('is-hidden');
    syncAdultStudentRespondent(data);
  }
  if (currentFormMode === 'edit_owner') {
    document.getElementById('submitForm').textContent = 'Desa els canvis';
  }
  if (['readonly','readonly_print','student_confirm'].includes(currentFormMode)) {
    setReadOnlyMode(currentFormMode === 'student_confirm');
  }
}

function setReadOnlyMode(allowStudentConfirm) {
  document.querySelectorAll('.translate-box input,.translate-box select,#authorizationForm input,#authorizationForm select,#authorizationForm textarea,#authorizationForm button').forEach(field => {
    field.disabled = true;
  });
  document.querySelectorAll('.accordion-collapse').forEach(section => section.classList.add('show'));
  document.querySelectorAll('.accordion-button').forEach(button => {
    button.classList.remove('collapsed');
    button.disabled = false;
  });
  const actions = document.querySelector('.sticky-actions .d-flex');
  actions.textContent = '';
  const printButton = document.createElement('button');
  printButton.className = 'btn btn-outline-secondary';
  printButton.type = 'button';
  printButton.textContent = 'Imprimeix';
  printButton.addEventListener('click', () => window.print());
  actions.appendChild(printButton);
  if (allowStudentConfirm) {
    const confirmButton = document.createElement('button');
    confirmButton.className = 'btn btn-primary';
    confirmButton.type = 'button';
    confirmButton.textContent = 'Confirmo';
    confirmButton.addEventListener('click', confirmStudentAuthorization);
    actions.appendChild(confirmButton);
  }
}

function confirmStudentAuthorization() {
  const token = document.getElementById('launcherToken').value;
  const formSession = document.getElementById('formSession').value;
  const respostaId = document.getElementById('responseId').value;
  const launcherUrl = (window.INITIAL_FORM_DATA || {}).launcher_url || '';
  if ((!token && !formSession) || !respostaId || !launcherUrl) {
    alert('No s ha pogut confirmar: falten dades de verificació.');
    return;
  }
  const formPost = document.createElement('form');
  formPost.method = 'post';
  formPost.action = launcherUrl;
  const fields = [['action','confirm_student'],['resposta_id',respostaId]];
  fields.push(token ? ['token',token] : ['form_session',formSession]);
  fields.forEach(([name,value]) => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value;
    formPost.appendChild(input);
  });
  document.body.appendChild(formPost);
  formPost.submit();
}

function isValidPhone(value){const compact=String(value||'').trim().replace(/[\s().-]/g,'');return /^\+?\d{8,15}$/.test(compact)||/^00\d{8,15}$/.test(compact)||/^[6789]\d{8}$/.test(compact);}

function submitForm(){
  const payload = formToObject();
  if (!payload.form_mode || (!payload.launcher_token && !payload.form_session)) {
    alert('No s ha pogut enviar el formulari: no s ha pogut verificar la sessió. Torna a obrir l’enllaç del correu i prova-ho de nou.');
    return;
  }
  const button=document.getElementById('submitForm');
  button.disabled=true;
  button.textContent='Enviant...';
  google.script.run.withSuccessHandler(result=>{
    button.textContent='Enviat';
    showSubmissionSuccess(result);
  }).withFailureHandler(error=>{
    button.disabled=false;
    button.textContent=currentFormMode==='edit_owner'?'Desa els canvis':'Envia el formulari';
    alert('No s ha pogut enviar el formulari: '+friendlySubmitErrorMessage_(error));
  }).submitAuthorizationResponse(payload);
}

function friendlySubmitErrorMessage_(error) {
  const message = String(error && error.message ? error.message : error || '');
  if (/verified launcher|launcher verification|launcher token|opened through/i.test(message)) {
    return 'no s ha pogut verificar la sessió. Torna a obrir l’enllaç del correu i prova-ho de nou.';
  }
  if (/already used/i.test(message)) {
    return 'aquest enllaç ja s ha utilitzat. Torna a iniciar el procés o demana un nou enllaç al centre.';
  }
  if (/expired/i.test(message)) {
    return 'aquest enllaç ha caducat. Torna a iniciar el procés per rebre un nou enllaç.';
  }
  return message;
}

function showSubmissionSuccess(result) {
  ['respondentStep','initialSetup','authorizationForm'].forEach(id => {
    const section = document.getElementById(id);
    if (section) section.classList.add('is-hidden');
  });
  const code = result && result.resposta_id ? String(result.resposta_id) : '';
  const codeNode = document.getElementById('submissionCode');
  if (codeNode) {
    codeNode.textContent = code ? I18n.t('Codi de resposta:') + ' ' + code : '';
    codeNode.classList.toggle('is-hidden', !code);
  }
  const success = document.getElementById('submissionSuccess');
  if (success) {
    success.classList.remove('is-hidden');
    success.focus();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  alert(I18n.t('La teva resposta ha estat correctament enregistrada.'));
  window.top.location.href = SUCCESS_REDIRECT_URL;
}


function updateSignatureFields(){const type=form.querySelector('[name="tipus_alumne"]:checked')?.value;const cfg=typeConfig[type];const actor=document.getElementById('verifiedActorType').value;document.getElementById('signatureResponsibleData').value=cfg?.responsible?'true':'false';document.getElementById('signatureStudentData').value=actor==='student'&&type==='major18'?'true':'false';}
if (!document.getElementById('dataSignatura').value) document.getElementById('dataSignatura').valueAsDate=new Date();
</script>

    "Realitzar activitats que fomentin hàbits saludables i la pràctica d'activitat física i esportiva.": "تنفيذ أنشطة تعزز العادات الصحية وممارسة النشاط البدني والرياضي.",

    "Respectar el sistema educatiu català, el caràcter propi de l'institut i l'autoritat del tutor/a, del professorat i de l'equip directiu.": "احترام النظام التعليمي الكتالوني، وطابع المعهد، وسلطة المرشد/ة والمعلمين وفريق الإدارة.",
    "Compartir amb el centre l'educació de l'alumne/a i afavorir el seu desenvolupament acadèmic i personal.": "مشاركة المركز في تعليم الطالب/ة ودعم تطوره/ها الأكاديمي والشخصي.",
    "Considerar les recomanacions del centre relatives a atenció educativa, derivacions, repetició o promoció de curs i orientació acadèmica.": "النظر في توصيات المركز المتعلقة بالدعم التعليمي والإحالات وإعادة السنة أو الانتقال إلى السنة التالية والتوجيه الأكاديمي.",
    "Instar l'alumne/a a respectar les normes de funcionament del centre, el deure d'estudi, el respecte als altres i les normes de convivència.": "حث الطالب/ة على احترام قواعد عمل المركز، وواجب الدراسة، واحترام الآخرين وقواعد التعايش.",
    "Facilitar a l'institut informacions rellevants per al procés d'aprenentatge i la salut de l'alumne/a.": "تزويد المعهد بالمعلومات ذات الصلة بعملية التعلم وصحة الطالب/ة.",
    "Aportar documents de justificació oficial en cas d'absència.": "تقديم وثائق تبرير رسمية في حالة الغياب.",
    "No enviar l'alumne/a a l'institut quan tingui febre, malalties contagioses, infeccions per polls o causes equivalents, i recollir-lo personalment o mitjançant una persona major d'edat autoritzada quan calgui.": "عدم إرسال الطالب/ة إلى المعهد عند وجود حمى أو أمراض معدية أو عدوى القمل أو أسباب مماثلة، واستلامه/ها شخصيًا أو بواسطة شخص بالغ مفوض عند الحاجة.",
    "Atendre en un període raonable les peticions d'entrevista o comunicació del centre i assistir puntualment a les reunions.": "الاستجابة خلال فترة معقولة لطلبات المقابلة أو التواصل من المركز والحضور في الوقت المحدد للاجتماعات.",
    "Respectar les NOFC i la regulació dels telèfons mòbils.": "احترام NOFC وتنظيم استخدام الهواتف المحمولة.",
    "Informar l'alumne/a menor d'edat de la signatura d'aquesta Carta de compromís educatiu i del que implica.": "إبلاغ الطالب/ة القاصر بتوقيع خطاب الالتزام التعليمي هذا وما يترتب عليه.",
    "I perquè així consti, ho signem a tots els efectes, a partir de la data d'avui.": "وإثباتًا لذلك، نوقعه لجميع الآثار اعتبارًا من تاريخ اليوم.",
    "He llegit i accepto la Carta de compromís educatiu.": "لقد قرأت وأقبل خطاب الالتزام التعليمي.",
    "7. Normativa d'ús de telèfons mòbils": "7. قواعد استخدام الهواتف المحمولة",
    "Normativa d'ús de telèfons mòbils": "قواعد استخدام الهواتف المحمولة",
    "Arran de l'aprovació de l'actualització de les NOFC, us informem de la normativa que regularà l'ús dels telèfons mòbils a l'institut Ernest Lluch i Martín.": "بعد الموافقة على تحديث NOFC، نعلمكم بالقواعد التي ستنظم استخدام الهواتف المحمولة في Institut Ernest Lluch i Martín.",
    "El centre entén que no hi ha cap urgència que justifiqui la utilització del telèfon mòbil. L'institut disposa de telèfon i personal de consergeria per agilitzar qualsevol informació que hagi d'arribar de les famílies a l'alumnat i viceversa.": "يرى المركز أنه لا توجد أي حالة طارئة تبرر استخدام الهاتف المحمول. لدى المعهد هاتف وطاقم استقبال لتسهيل أي معلومات يجب أن تصل من الأسر إلى الطلاب أو العكس.",
    "L'ús de telèfons mòbils està prohibit per a l'alumnat en tots els espais del centre educatiu i en totes les activitats educatives que puguin tenir lloc fora del centre. La tinència del dispositiu només és possible si està completament apagat en entrar al centre i si l'institut té constància escrita del consentiment familiar.": "يُحظر على الطلاب استخدام الهواتف المحمولة في جميع فضاءات المركز التعليمي وفي جميع الأنشطة التعليمية التي قد تتم خارجه. ولا يُسمح بحيازة الجهاز إلا إذا كان مطفأ تمامًا عند دخول المركز وكان لدى المعهد موافقة خطية من الأسرة.",
    "Aquestes indicacions també s'han de complir en activitats fora del centre: sortides, colònies, viatges, projectes compartits, activitats amb famílies o comunitat educativa, extraescolars i activitats amb entitats de l'entorn.": "يجب الالتزام بهذه التعليمات أيضًا في الأنشطة خارج المركز: الخرجات، المخيمات، الرحلات، المشاريع المشتركة، الأنشطة مع الأسر أو المجتمع التعليمي، الأنشطة اللامنهجية والأنشطة مع مؤسسات البيئة المحلية.",
    "Estudis postobligatoris": "الدراسات ما بعد الإلزامية",
    "L'alumnat d'estudis postobligatoris ha de fer un ús responsable dels dispositius mòbils i vincular-los a les activitats d'aprenentatge quan el professorat ho indiqui.": "على طلاب الدراسات ما بعد الإلزامية استخدام الأجهزة المحمولة بمسؤولية وربطها بأنشطة التعلم عندما يشير المعلمون إلى ذلك.",
    "Excepcionalitats": "استثناءات",
    "Salut: es permet utilitzar un dispositiu quan l'alumnat tingui una necessitat específica per motius de salut.": "الصحة: يُسمح باستخدام جهاز عندما يكون لدى الطالب/ة حاجة محددة لأسباب صحية.",
    "NESE: es permet utilitzar un dispositiu quan sigui necessari per facilitar l'accés a l'aprenentatge, la participació o la comunicació.": "NESE: يُسمح باستخدام جهاز عندما يكون ضروريًا لتسهيل الوصول إلى التعلم أو المشاركة أو التواصل.",
    "Emergències: en una situació d'emergència, l'alumnat pot utilitzar el telèfon mòbil per comunicar-se amb la família.": "الطوارئ: في حالة طارئة، يمكن للطالب/ة استخدام الهاتف المحمول للتواصل مع الأسرة.",
    "Mesures correctores i sancions": "تدابير تصحيحية وعقوبات",
    "L'ús del telèfon mòbil sense consentiment previ d'un docent pot constituir una falta lleu si no afecta drets fonamentals o protecció de dades.": "قد يشكل استخدام الهاتف المحمول دون موافقة مسبقة من أحد المعلمين مخالفة بسيطة إذا لم يمس الحقوق الأساسية أو حماية البيانات.",
    "L'ús que vulneri drets fonamentals pot constituir una falta greument perjudicial per a la convivència i comportar expedient disciplinari.": "الاستخدام الذي ينتهك الحقوق الأساسية قد يشكل مخالفة خطيرة تضر بالتعايش وقد يؤدي إلى فتح إجراء تأديبي.",
    "Si un alumne/a es nega a lliurar el telèfon quan se li demana, es considera falta molt greu.": "إذا رفض الطالب/ة تسليم الهاتف عند طلب ذلك، فيُعتبر ذلك مخالفة خطيرة جدًا.",
    "L'institut no es fa responsable de desperfectes o robatoris. Les famílies i l'alumnat han de conèixer aquesta normativa, i qualsevol professor/a pot comprovar que el telèfon està completament apagat.": "لا يتحمل المعهد مسؤولية الأضرار أو السرقة. يجب على الأسر والطلاب معرفة هذه القواعد، ويمكن لأي معلم/ة التحقق من أن الهاتف مطفأ تمامًا.",
    "Només es considera realment apagat si l'accés a qualsevol aplicació necessita que el dispositiu iniciï el sistema operatiu. No ho són el bloqueig de pantalla, el mode avió, el mode rellotge o estats equivalents.": "يُعتبر الهاتف مطفأً فعلاً فقط إذا كان الوصول إلى أي تطبيق يتطلب تشغيل نظام الجهاز. ولا يُعد قفل الشاشة أو وضع الطيران أو وضع الساعة أو الحالات المماثلة إطفاءً فعليًا.",
    "En cas d'ús de telèfon mòbil sense consentiment familiar o sense complir la normativa, s'aplicaran les mesures disciplinàries corresponents.": "في حالة استخدام الهاتف المحمول دون موافقة الأسرة أو دون الالتزام بالقواعد، ستُطبق التدابير التأديبية المناسبة.",
    "Consentiment sobre la tinència de telèfon mòbil al centre": "الموافقة على حمل الهاتف المحمول في المركز",
    "NO DONO EL MEU CONSENTIMENT a què el meu fill/a porti telèfon mòbil, atenent-me a la normativa aquí descrita.": "لا أوافق على أن يحضر ابني/ابنتي هاتفًا محمولًا، وفقًا للقواعد الموضحة هنا.",
    "DONO EL MEU CONSENTIMENT PARTICULAR a què el meu fill/a porti telèfon mòbil al centre, atenent-me a la normativa aquí descrita.": "أوافق موافقة خاصة على أن يحضر ابني/ابنتي هاتفًا محمولًا إلى المركز، وفقًا للقواعد الموضحة هنا.",
    "8. Lloc, data i signatures": "8. المكان والتاريخ والتوقيعات",
    "Carregant": "تحميل",
    "Preparant el formulari...": "تحضير النموذج...",
    "2. Autoritzacions per a l’estada de l’alumnat al centre": "2. التصريحات للطلاب بالبقاء في المركز",
    "Informació bàsica sobre protecció de dades personals": "معلومات أساسية عن حماية البيانات الشخصية",
    "Responsable: direcció del centre educatiu, de titularitat del Departament d’Educació i Formació Professional.": "المسؤول: إدارة المركز التعليمي التابع لإدارة التعليم والتدريب المهني.",
    "Finalitat: la funció educativa i la gestió de la permanència i la sortida de l’alumnat del centre. L’atenció de les necessitats sanitàries de l’alumnat.": "الغرض: الوظيفة التعليمية وإدارة إقامة وخروج الطلاب من المركز. الاهتمام بالاحتياجات الصحية للطلاب.",
    "Drets: es poden exercir els drets d’accés, rectificació, supressió, limitació del tractament, oposició i la resta de drets previstos per la normativa vigent davant la direcció del centre educatiu. També es pot presentar una reclamació davant l’Autoritat Catalana de Protecció de Dades.": "الحقوق: يمكنك ممارسة حقوق الوصول والتصحيح والحذف وتقييد المعالجة والمعارضة وباقي الحقوق المنصوص عليها في الأنظمة المعمول بها قبل إدارة المركز التعليمي. يمكن أيضًا تقديم مطالبة إلى هيئة حماية البيانات الكاتالونية.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Alumnes de centres educatius de titularitat del Departament d’Educació i Formació Professional.": "يمكنك الاطلاع على معلومات إضافية حول هذا العلاج على موقع الوزارة (educacio.gencat.cat)، في القسم > حماية البيانات > سجل الأنشطة العلاجية > القائمة الأبجدية > طلاب المراكز التعليمية المملوكة لوزارة التعليم والتدريب المهني.",
    "Autoritzo, com a responsable legal de l’alumne/a:": "أصرح، بصفتي الوصي القانوني للطالب:",
    "Sortida amb/sense acompanyament del centre fora de l’horari lectiu (d’acord amb les normes d’organització i funcionament del centre, NOFC, aprovades pel consell escolar del centre)": "مغادرة المركز مع/بدون مرافق خارج ساعات الدراسة (وفقًا لقواعد تنظيم وتشغيل المركز NOFC، المعتمدة من قبل مجلس المدرسة بالمركز)",
    "Que l’alumne/a marxi del centre fora de l’horari lectiu acompanyat/ada per les persones següents (un cop s’hagin acreditat documentalment):": "أن يغادر الطالب المركز خارج أوقات الدراسة برفقة الأشخاص التالية أسماؤهم (بعد توثيقهم):",
    "3. Publicacions: protecció de dades i propietat intel·lectual": "3. المنشورات: حماية البيانات والملكية الفكرية",
    "La publicació d’imatges/veu i del material elaborat és opcional i no condiciona l’activitat lectiva. El consentiment és revocable i sense efectes retroactius.": "إن نشر الصور/الصوت والمواد المعدة هو أمر اختياري ولا يشترط النشاط التدريسي. الموافقة قابلة للإلغاء وليس لها أثر رجعي.",
    "Finalitat: la gestió de la difusió i conservació del material elaborat per l’alumnat, i l’ús de la imatge i veu en espais de comunicació digitals.": "الغرض: إدارة نشر وحفظ المواد التي ينتجها الطلاب، واستخدام الصورة والصوت في مساحات الاتصال الرقمي.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Publicació d’imatges i veu en els espais de comunicació i difusió dels serveis educatius.": "يمكنك الاطلاع على معلومات إضافية حول هذا العلاج على موقع الوزارة (educacio.gencat.cat)، في القسم > حماية البيانات > سجل أنشطة العلاج > القائمة الأبجدية > نشر الصور والصوت في مجالات الاتصال ونشر الخدمات التعليمية.",
    "Ús d’imatges, publicació de dades de caràcter personal i material elaborat": "استخدام الصور ونشر البيانات الشخصية والمواد المعدة",
    "1. La publicació de la imatge/veu de l’alumne/a en activitats del centre:": "1. نشر صورة/صوت الطالب في أنشطة المركز:",
    "— Intranet amb accés restringit (plataformes del centre: Moodle/Àgora, Google Workspace, etc.):": "— إنترانت ذات وصول مقيد (منصات المركز: Moodle/Àgora، Google Workspace، وما إلى ذلك):",
    "— Internet amb accés obert (web, blogs del centre):": "— إنترنت مفتوح الوصول (الويب، مدونات المركز):",
    "— Plataformes no administrades pel centre (YouTube, Instagram, altres —especifiqueu-les—):": "— المنصات التي لا يديرها المركز (يوتيوب، إنستغرام، وغيرها – حددها —):",
    "Plataformes/Accés:": "المنصات/الوصول:",
    "2. La publicació de les inicials de l’alumne/a i del centre:": "2. نشر الأحرف الأولى من اسم الطالب والمركز:",
    "Publicació i preservació d’obres i creacions": "نشر وحفظ المصنفات والإبداعات",
    "1. La publicació del material que elabori l’alumne/a (treball de síntesi, projecte de recerca, obra final, etc.) a plataformes d’accés obert:": "1. نشر المادة التي أعدها الطالب (عمل تجميعي، مشروع بحثي، عمل نهائي، إلخ) على منصات الوصول المفتوح:",
    "2. La publicació de l’obra que elabori l’alumne/a en espais de comunicació del centre (web, blogs, revistes, xarxes gestionades pel centre):": "2. نشر الأعمال التي ينتجها الطالب في مساحات التواصل الخاصة بالمركز (الويب، المدونات، المجلات، الشبكات التي يديرها المركز):",
    "3. La preservació/desament de l’obra:": "3. الحفاظ على المصنف:",
    "— A la biblioteca física o digital del centre:": "— في المكتبة المادية أو الرقمية للمركز:",
    "— Al repositori del Departament:": "- في مستودع القسم:",
    "Actuacions necessàries per a la publicació i el desament (si escau):": "الإجراءات المطلوبة للنشر والحفظ (إن وجدت):",
    "La publicació i el desament d’obres originals es regeixen pel Reial decret legislatiu 1/1996 (Llei de propietat intel·lectual). El consentiment és revocable i la revocació no té efectes retroactius.": "يخضع نشر وتخزين الأعمال الأصلية للمرسوم التشريعي الملكي رقم 1/1996 (قانون الملكية الفكرية). الموافقة قابلة للإلغاء وليس للإلغاء أي أثر رجعي.",
    "Les autoritzacions de consentiment (imatges/obres) són vàlides fins a la seva modificació o revocació. Les comunicacions i autoritzacions organitzatives s’apliquen durant l’escolarització, amb possibilitat de modificar-les si canvien les circumstàncies familiars.": "تعتبر تفويضات الموافقة (الصور/الأعمال) صالحة حتى يتم تعديلها أو إبطالها. تنطبق الاتصالات والتفويضات التنظيمية أثناء الدراسة، مع إمكانية تعديلها إذا تغيرت الظروف العائلية.",
    "4. Autoritzacions per utilitzar plataformes i eines digitals": "4. صلاحيات استخدام المنصات والأدوات الرقمية",
    "Finalitat: gestionar l’activitat educativa mitjançant les plataformes digitals que el Departament habilita per a l’alumnat. Entre d’altres, crear i gestionar comptes d’usuari per accedir a les eines de cada plataforma amb l’objectiu de facilitar l’aprenentatge digital i l’adquisició de competències digitals, seguint el currículum educatiu.": "الغرض: إدارة النشاط التعليمي من خلال المنصات الرقمية التي يتيحها القسم للطلبة. من بين أمور أخرى، إنشاء وإدارة حسابات المستخدمين للوصول إلى أدوات كل منصة بهدف تسهيل التعلم الرقمي واكتساب المهارات الرقمية، باتباع المنهج التعليمي.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica >Plataformes i eines digitals educatives dels centres educatius": "يمكنك الاطلاع على معلومات إضافية حول هذا العلاج على موقع القسم (educacio.gencat.cat)، في القسم > حماية البيانات > سجل أنشطة العلاج > القائمة الأبجدية > المنصات التعليمية الرقمية وأدوات المراكز التعليمية",
    "Comunicació sobre l’ús de plataformes i eines digitals en l’àmbit educatiu": "التواصل حول استخدام المنصات والأدوات الرقمية في المجال التعليمي",
    "1. Informació sobre les plataformes digitals": "1. معلومات عن المنصات الرقمية",
    "El centre educatiu utilitza plataformes i eines digitals habilitades pel Departament d’Educació i Formació Professional, o autoritzades institucionalment per a finalitats educatives i professionals, per facilitar el desenvolupament de l’activitat educativa, docent i organitzativa del centre i contribuir a l’assoliment de les competències digitals incloses en el currículum educatiu vigent, tant en l’escolarització obligatòria com en la postobligatòria, d’acord amb la normativa vigent.": "يستخدم المركز التعليمي المنصات والأدوات الرقمية التي تتيحها دائرة التعليم والتدريب المهني، أو المصرح بها مؤسسياً للأغراض التعليمية والمهنية، لتسهيل تطوير النشاط التعليمي والتدريسي والتنظيمي للمركز والمساهمة في تحقيق المهارات الرقمية المتضمنة في المنهج التعليمي الحالي، سواء في التعليم الإلزامي وما بعد الإلزامي، وفقاً للوائح الحالية.",
    "Les eines i plataformes que es poden utilitzar són:": "الأدوات والمنصات التي يمكن استخدامها هي:",
    "Google Workspace for Education": "مساحة عمل جوجل للتعليم",
    "Microsoft 365 Educació": "مايكروسوفت 365 التعليم",
    "Moodle": "موودل",
    "Altres eines i serveis digitals amb finalitats educatives autoritzats pel Departament d’Educació i Formació Professional o pel centre educatiu": "الأدوات والخدمات الرقمية الأخرى للأغراض التعليمية المصرح بها من قبل دائرة التعليم والتدريب المهني أو المركز التعليمي",

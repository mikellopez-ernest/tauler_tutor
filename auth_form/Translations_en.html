    "Institut Ernest Lluch i Martín": "Institut Ernest Lluch i Martín",
    "La Llei d'Educació de Catalunya (12/2009), a l'article 20, estableix que els centres, d'acord amb els seus projectes educatius, han de formular una carta de compromís educatiu per assolir un entorn de convivència i respecte.": "Catalonia Education Act (12/2009), article 20, establishes that schools, in accordance with their educational projects, must draw up an educational commitment letter to achieve an environment of coexistence and respect.",
    "L'educació de l'alumnat implica l'acció conjunta de la família i de l'institut. Aquesta carta comporta els compromisos següents:": "The student’s education involves joint action by the family and the school. This letter includes the following commitments:",
    "Per part del centre": "By the school",
    "Vetllar per fer efectius els drets de l'alumnat en l'àmbit escolar: formació integral, valoració objectiva, respecte a les conviccions, integritat i dignitat personal, participació, reunió i associació, informació, llibertat d'expressió, orientació, igualtat d'oportunitats, protecció social i protecció dels drets de l'alumnat.": "To ensure students’ rights at school: comprehensive education, objective assessment, respect for beliefs, personal integrity and dignity, participation, meeting and association, information, freedom of expression, guidance, equal opportunities, social protection and protection of students’ rights.",
    "Assignar un tutor/a a cada alumne/a i mantenir com a mínim una entrevista per curs amb la família quan correspongui.": "To assign a tutor to each student and hold at least one interview per school year with the family when appropriate.",
    "Lliurar els butlletins d'avaluació i explicar els criteris d'avaluació a l'alumnat.": "To provide assessment reports and explain assessment criteria to students.",
    "Utilitzar estratègies metodològiques diverses per exigir a cada alumne/a el màxim de les seves possibilitats i proporcionar un alt nivell acadèmic.": "To use varied methodological strategies to demand the best of each student and provide a high academic standard.",
    "Proporcionar experiències culturals, socials, ambientals i d'orientació mitjançant activitats, sortides, xerrades, concursos i certàmens.": "To provide cultural, social, environmental and guidance experiences through activities, trips, talks, competitions and events.",

    "Aquestes indicacions també s'han de complir en activitats fora del centre: sortides, colònies, viatges, projectes compartits, activitats amb famílies o comunitat educativa, extraescolars i activitats amb entitats de l'entorn.": "These instructions must also be followed in activities outside the school: trips, camps, journeys, shared projects, activities with families or the educational community, extracurricular activities and activities with local organisations.",

    "Sortida amb/sense acompanyament del centre fora de l’horari lectiu (d’acord amb les normes d’organització i funcionament del centre, NOFC, aprovades pel consell escolar del centre)": "Leaving the center with/unaccompanied outside of school hours (in accordance with the rules for the organization and operation of the center, NOFC, approved by the school council of the center)",
    "Que l’alumne/a marxi del centre fora de l’horari lectiu acompanyat/ada per les persones següents (un cop s’hagin acreditat documentalment):": "That the student leaves the center outside of school hours accompanied by the following people (once they have been documented):",
    "3. Publicacions: protecció de dades i propietat intel·lectual": "3. Publications: data protection and intellectual property",
    "La publicació d’imatges/veu i del material elaborat és opcional i no condiciona l’activitat lectiva. El consentiment és revocable i sense efectes retroactius.": "The publication of images/voice and the prepared material is optional and does not condition the teaching activity. Consent is revocable and without retroactive effect.",
    "Finalitat: la gestió de la difusió i conservació del material elaborat per l’alumnat, i l’ús de la imatge i veu en espais de comunicació digitals.": "Purpose: the management of the dissemination and conservation of the material produced by the students, and the use of image and voice in digital communication spaces.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Publicació d’imatges i veu en els espais de comunicació i difusió dels serveis educatius.": "You can consult additional information about this treatment on the Department's website (educacio.gencat.cat), in the Department > Data protection > Record of treatment activities > Alphabetical list > Publication of images and voice in the communication and dissemination areas of educational services.",
    "Ús d’imatges, publicació de dades de caràcter personal i material elaborat": "Use of images, publication of personal data and prepared material",
    "1. La publicació de la imatge/veu de l’alumne/a en activitats del centre:": "1. The publication of the student’s image/voice in center activities:",
    "— Intranet amb accés restringit (plataformes del centre: Moodle/Àgora, Google Workspace, etc.):": "— Intranet with restricted access (center platforms: Moodle/Àgora, Google Workspace, etc.):",

    "2. La publicació de les inicials de l’alumne/a i del centre:": "2. The publication of the initials of the student and the center:",
    "Publicació i preservació d’obres i creacions": "Publication and preservation of works and creations",
    "1. La publicació del material que elabori l’alumne/a (treball de síntesi, projecte de recerca, obra final, etc.) a plataformes d’accés obert:": "1. The publication of the material prepared by the student (synthesis work, research project, final work, etc.) on open access platforms:",
    "2. La publicació de l’obra que elabori l’alumne/a en espais de comunicació del centre (web, blogs, revistes, xarxes gestionades pel centre):": "2. The publication of the work produced by the student in the center’s communication spaces (web, blogs, magazines, networks managed by the center):",
    "3. La preservació/desament de l’obra:": "3. The preservation/saving of the work:",
    "— A la biblioteca física o digital del centre:": "— In the centre’s physical or digital library:",
    "— Al repositori del Departament:": "— In the Department's repository:",
    "Actuacions necessàries per a la publicació i el desament (si escau):": "Actions required for publishing and saving (if applicable):",
    "La publicació i el desament d’obres originals es regeixen pel Reial decret legislatiu 1/1996 (Llei de propietat intel·lectual). El consentiment és revocable i la revocació no té efectes retroactius.": "The publication and storage of original works are governed by Royal Legislative Decree 1/1996 (Intellectual Property Law). Consent is revocable and revocation has no retroactive effect.",
    "Les autoritzacions de consentiment (imatges/obres) són vàlides fins a la seva modificació o revocació. Les comunicacions i autoritzacions organitzatives s’apliquen durant l’escolarització, amb possibilitat de modificar-les si canvien les circumstàncies familiars.": "Consent authorizations (images/works) are valid until modified or revoked. Organizational communications and authorizations apply during schooling, with the possibility of modifying them if family circumstances change.",
    "4. Autoritzacions per utilitzar plataformes i eines digitals": "4. Authorizations to use digital platforms and tools",
    "Finalitat: gestionar l’activitat educativa mitjançant les plataformes digitals que el Departament habilita per a l’alumnat. Entre d’altres, crear i gestionar comptes d’usuari per accedir a les eines de cada plataforma amb l’objectiu de facilitar l’aprenentatge digital i l’adquisició de competències digitals, seguint el currículum educatiu.": "Purpose: to manage the educational activity through the digital platforms that the Department enables for students. Among others, create and manage user accounts to access the tools of each platform with the aim of facilitating digital learning and the acquisition of digital skills, following the educational curriculum.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica >Plataformes i eines digitals educatives dels centres educatius": "You can consult additional information about this treatment on the Department's website (educacio.gencat.cat), in the Department > Data protection > Record of treatment activities > Alphabetical list > Digital educational platforms and tools of educational centers",
    "Comunicació sobre l’ús de plataformes i eines digitals en l’àmbit educatiu": "Communication on the use of digital platforms and tools in the educational field",
    "1. Informació sobre les plataformes digitals": "1. Information on digital platforms",
    "El centre educatiu utilitza plataformes i eines digitals habilitades pel Departament d’Educació i Formació Professional, o autoritzades institucionalment per a finalitats educatives i professionals, per facilitar el desenvolupament de l’activitat educativa, docent i organitzativa del centre i contribuir a l’assoliment de les competències digitals incloses en el currículum educatiu vigent, tant en l’escolarització obligatòria com en la postobligatòria, d’acord amb la normativa vigent.": "The educational center uses digital platforms and tools enabled by the Department of Education and Vocational Training, or institutionally authorized for educational and professional purposes, to facilitate the development of the educational, teaching and organizational activity of the center and contribute to the achievement of the digital skills included in the current educational curriculum, both in compulsory and post-compulsory schooling, in accordance with current regulations.",
    "Les eines i plataformes que es poden utilitzar són:": "The tools and platforms that can be used are:",
    "Google Workspace for Education": "Google Workspace for Education",
    "Microsoft 365 Educació": "Microsoft 365 Education",
    "Moodle": "Moodle",
    "Altres eines i serveis digitals amb finalitats educatives autoritzats pel Departament d’Educació i Formació Professional o pel centre educatiu": "Other digital tools and services for educational purposes authorized by the Department of Education and Vocational Training or by the educational center",
    "Aquestes plataformes ofereixen entorns virtuals d’aprenentatge, eines de comunicació, treball col·laboratiu, videoconferència, emmagatzematge i gestió acadèmica que donen suport a les activitats docents, educatives i organitzatives del centre.": "These platforms offer virtual learning environments, communication tools, collaborative work, video conferencing, storage and academic management that support the teaching, educational and organizational activities of the centre.",
    "L’ús d’aquestes eines comporta la creació i gestió de comptes corporatius del professorat dins dels entorns digitals educatius institucionals.": "The use of these tools involves the creation and management of corporate accounts for teachers within institutional digital educational environments.",
    "Els serveis digitals associats tenen una finalitat estrictament educativa, docent, professional i organitzativa, i s’utilitzen en el marc de les funcions pròpies del sistema educatiu.": "The associated digital services have a strictly educational, teaching, professional and organizational purpose, and are used within the framework of the educational system's own functions.",
    "1.1. Finalitat i ús educatiu de les plataformes digitals": "1.1. Purpose and educational use of digital platforms",
    "Les plataformes i eines digitals s’utilitzen per:": "Digital platforms and tools are used to:",
    "desenvolupar activitats educatives i acadèmiques;": "develop educational and academic activities;",
    "facilitar la comunicació i el treball col·laboratiu entre els membres de la comunitat educativa;": "facilitate communication and collaborative work between members of the educational community;",
    "gestionar activitats docents i organitzatives del centre;": "manage teaching and organizational activities of the center;",
    "elaborar, compartir i gestionar continguts i recursos educatius digitals;": "develop, share and manage content and digital educational resources;",
    "participar en entorns virtuals d’aprenentatge, i": "participate in virtual learning environments, i",
    "contribuir al desenvolupament de les competències digitals de l’alumnat i del professorat.": "contribute to the development of the digital skills of students and teachers.",
    "1.2. Mesures de control i seguretat": "1.2. Control and security measures",
    "El centre educatiu i el Departament d’Educació i Formació Professional adopten mesures tècniques i organitzatives per garantir un ús segur, adequat i proporcional de les plataformes i eines digitals utilitzades en l’àmbit educatiu. Les principals són:": "The educational center and the Department of Vocational Education and Training adopt technical and organizational measures to guarantee a safe, appropriate and proportionate use of the digital platforms and tools used in the educational field. The main ones are:",
    "Els comptes del professorat es gestionen dins d’un entorn institucional controlat i configurat amb mesures de seguretat adequades a les finalitats educatives i professionals del servei.": "Teacher accounts are managed within a controlled institutional environment and configured with security measures appropriate to the educational and professional purposes of the service.",
    "Amb caràcter general, els serveis digitals s’utilitzen en entorns restringits a la comunitat educativa i amb controls d’accés que limiten la comunicació i la compartició de continguts a les persones autoritzades.": "In general, digital services are used in environments restricted to the educational community and with access controls that limit communication and content sharing to authorized people.",
    "El Departament i els centres educatius adopten igualment mesures de minimització de dades, una configuració segura dels serveis digitals i la limitació de funcionalitats no necessàries per a l’activitat educativa, amb la finalitat de protegir la privacitat dels usuaris i garantir un ús adequat de les tecnologies digitals.": "The Department and the educational centers also adopt data minimization measures, a secure configuration of digital services and the limitation of functionalities not necessary for the educational activity, in order to protect the privacy of users and guarantee an appropriate use of digital technologies.",
    "Els serveis o productes addicionals que no siguin necessaris per al desenvolupament ordinari de l’activitat educativa es poden mantenir desactivats o subjectes a condicions específiques d’ús.": "Additional services or products that are not necessary for the ordinary development of the educational activity can be kept deactivated or subject to specific conditions of use.",
    "2. Compromisos i responsabilitats": "2. Commitments and responsibilities",
    "Els principals compromisos i responsabilitats associats a l’ús de les plataformes i eines digitals són:": "The main commitments and responsibilities associated with the use of digital platforms and tools are:",
    "Les plataformes i eines digitals de l’àmbit educatiu s’utilitzen exclusivament per a finalitats educatives, pedagògiques, orientadores i professionals vinculades a l’activitat docent i organitzativa del centre educatiu.": "Digital platforms and tools in the educational field are used exclusively for educational, pedagogical, guidance and professional purposes linked to the teaching and organizational activity of the educational center.",
    "Els serveis, funcionalitats o productes addicionals vinculats a aquestes plataformes digitals que no siguin necessaris per a l’activitat educativa habitual es poden mantenir desactivats o subjectes a condicions específiques d’ús establertes pel Departament o pel centre educatiu. En aquests casos, no s’hi poden utilitzar dades personals de l’alumnat ni permetre que l’alumnat hi accedeixi directament amb el seu compte o interactuï amb continguts no verificats.": "The services, functionalities or additional products linked to these digital platforms that are not necessary for the usual educational activity can be kept deactivated or subject to specific conditions of use established by the Department or the educational center. In these cases, students' personal data cannot be used, nor can students be allowed to access it directly with their account or interact with unverified content.",
    "El professorat es compromet a utilitzar els comptes i les eines digitals de manera diligent i confidencial, d’acord amb la normativa vigent, i a adoptar les mesures necessàries per protegir les dades personals i evitar accessos no autoritzats, usos indeguts o comunicacions no autoritzades de la informació.": "The teaching staff undertakes to use the accounts and digital tools diligently and confidentially, in accordance with current regulations, and to adopt the necessary measures to protect personal data and avoid unauthorized access, improper use or unauthorized communications of information.",
    "Al web del centre educatiu es pot consultar informació addicional sobre les normes d’ús, seguretat i funcionament de les eines digitals utilitzades en el desenvolupament de l’activitat educativa.": "On the website of the educational center you can consult additional information on the rules of use, safety and operation of the digital tools used in the development of the educational activity.",
    "L’usuari és responsable de qualsevol ús de plataformes, aplicacions o serveis digitals diferents dels habilitats o autoritzats pel Departament d’Educació i Formació Professional o pel centre educatiu, així com de qualsevol ús diferent del previst en aquest document, i ha de garantir en tot moment el compliment de la normativa vigent en matèria de protecció de dades, seguretat de la informació i ús adequat de les tecnologies digitals.": "The user is responsible for any use of platforms, applications or digital services other than the skills or authorized by the Department of Education and Vocational Training or by the educational center, as well as any use other than that provided for in this document, and must at all times ensure compliance with current regulations on data protection, information security and appropriate use of digital technologies.",
    "Declaro": "I declare",
    "Que he rebut informació sobre l’ús de les plataformes i eines digitals en l’àmbit educatiu, sobre les seves finalitats pedagògiques i educatives, així com la informació sobre el tractament de dades personals associat al seu ús.": "That I have received information about the use of digital platforms and tools in the educational field, about their pedagogical and educational purposes, as well as information about the processing of personal data associated with their use.",
    "5. Autoritzacions de salut": "5. Health authorizations",
    "Responsable: direcció del centre educatiu de titularitat del Departament.": "Responsible: management of the educational center owned by the Department.",
    "Finalitat: l’atenció de les necessitats de salut de l’alumnat al centre educatiu.": "Purpose: attention to the health needs of students at the educational center.",
    "L’alumne/a té diagnosticat/s el/s problema/es de salut següent/s (indiqueu si es produeix per contacte, ingestió o inhalació, i les reaccions que pot presentar):": "The student has been diagnosed with the following health problem(s) (indicate whether it is caused by contact, ingestion or inhalation, and the reactions it may present):",
    "Declaro que és imprescindible que l’alumne/a prengui medicació en horari lectiu, com consta en el pla de medicació adjunt (el qual ha d’incloure del nom de l’alumne/a, el nom del medicament i la pauta d’administració).": "I declare that it is essential that the student take medication during school hours, as stated in the attached medication plan (which must include the name of the student, the name of the medication and the administration schedule).",
    "Sí, autoritzo la direcció del centre educatiu i el personal del centre perquè administri a l’alumne/a la medicació prescrita, d’acord amb les pautes que constin en el pla de medicació esmentat anteriorment.": "Yes, I authorize the management of the educational center and the staff of the center to administer the prescribed medication to the student, in accordance with the guidelines contained in the medication plan mentioned above.",
    "Aquesta autorització no tindrà efectes pràctics si no es presenta amb l’informe mèdic corresponent.": "This authorization will not have practical effects if it is not presented with the corresponding medical report.",
    "Autoritzo que el centre educatiu pugui administrar paracetamol a l’alumne/a en cas que presenti febre superior a 38 °C de temperatura corporal mentre s’espera l’arribada d’algun familiar que el pugui portar a casa (també en sortides escolars i colònies programades considerades activitats lectives).": "I authorize the educational center to administer paracetamol to the student in the event that he/she has a fever higher than 38 °C body temperature while waiting for the arrival of a family member who can take him home (also on school trips and scheduled camps considered educational activities).",

    "Que l’alumne/a participi en activitats programades dins del municipi i en horari lectiu, amb ús de les dades necessàries i representació de l'alumne/a per una persona responsable del centre.": "That the student participates in scheduled activities within the municipality and during school hours, with use of the necessary data and representation of the student by a responsible member of the school staff.",

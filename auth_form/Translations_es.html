    "Emergències: en una situació d'emergència, l'alumnat pot utilitzar el telèfon mòbil per comunicar-se amb la família.": "Emergencias: en una situación de emergencia, el alumnado puede utilizar el teléfono móvil para comunicarse con la familia.",
    "Mesures correctores i sancions": "Medidas correctoras y sanciones",
    "L'ús del telèfon mòbil sense consentiment previ d'un docent pot constituir una falta lleu si no afecta drets fonamentals o protecció de dades.": "El uso del teléfono móvil sin consentimiento previo de un docente puede constituir una falta leve si no afecta a derechos fundamentales o protección de datos.",
    "L'ús que vulneri drets fonamentals pot constituir una falta greument perjudicial per a la convivència i comportar expedient disciplinari.": "El uso que vulnere derechos fundamentales puede constituir una falta gravemente perjudicial para la convivencia y comportar expediente disciplinario.",
    "Si un alumne/a es nega a lliurar el telèfon quan se li demana, es considera falta molt greu.": "Si un alumno/a se niega a entregar el teléfono cuando se le pide, se considera falta muy grave.",
    "L'institut no es fa responsable de desperfectes o robatoris. Les famílies i l'alumnat han de conèixer aquesta normativa, i qualsevol professor/a pot comprovar que el telèfon està completament apagat.": "El instituto no se hace responsable de desperfectos o robos. Las familias y el alumnado deben conocer esta normativa, y cualquier profesor/a puede comprobar que el teléfono está completamente apagado.",
    "Només es considera realment apagat si l'accés a qualsevol aplicació necessita que el dispositiu iniciï el sistema operatiu. No ho són el bloqueig de pantalla, el mode avió, el mode rellotge o estats equivalents.": "Solo se considera realmente apagado si el acceso a cualquier aplicación necesita que el dispositivo inicie el sistema operativo. No lo son el bloqueo de pantalla, el modo avión, el modo reloj o estados equivalentes.",
    "En cas d'ús de telèfon mòbil sense consentiment familiar o sense complir la normativa, s'aplicaran les mesures disciplinàries corresponents.": "En caso de uso de teléfono móvil sin consentimiento familiar o sin cumplir la normativa, se aplicarán las medidas disciplinarias correspondientes.",

    "Responsable: direcció del centre educatiu, de titularitat del Departament d’Educació i Formació Professional.": "Responsable: jefatura del centro educativo, de titularidad del Departamento de Educación y Formación Profesional.",
    "Finalitat: la funció educativa i la gestió de la permanència i la sortida de l’alumnat del centre. L’atenció de les necessitats sanitàries de l’alumnat.": "Finalidad: la función educativa y la gestión de la permanencia y la salida del alumnado del centro. La atención de las necesidades sanitarias del alumnado.",
    "Drets: es poden exercir els drets d’accés, rectificació, supressió, limitació del tractament, oposició i la resta de drets previstos per la normativa vigent davant la direcció del centre educatiu. També es pot presentar una reclamació davant l’Autoritat Catalana de Protecció de Dades.": "Derechos: pueden ejercerse los derechos de acceso, rectificación, supresión, limitación del tratamiento, oposición y demás derechos previstos por la normativa vigente ante la dirección del centro educativo. También puede presentarse una reclamación ante la Autoridad Catalana de Protección de Datos.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Alumnes de centres educatius de titularitat del Departament d’Educació i Formació Professional.": "Puede consultar información adicional sobre este tratamiento en la web del Departamento (educacio.gencat.cat), en el apartado Departamento > Protección de datos > Registro de actividades de tratamiento > Lista alfabética > Alumnos de centros educativos de titularidad del Departamento de Educación y Formación Profesional.",

    "3. Publicacions: protecció de dades i propietat intel·lectual": "3. Publicaciones: protección de datos y propiedad intelectual",
    "La publicació d’imatges/veu i del material elaborat és opcional i no condiciona l’activitat lectiva. El consentiment és revocable i sense efectes retroactius.": "La publicación de imágenes/voz y del material elaborado es opcional y no condiciona la actividad lectiva. El consentimiento es revocable y sin efectos retroactivos.",
    "Finalitat: la gestió de la difusió i conservació del material elaborat per l’alumnat, i l’ús de la imatge i veu en espais de comunicació digitals.": "Finalidad: la gestión de la difusión y conservación del material elaborado por el alumnado, y el uso de la imagen y voz en espacios de comunicación digitales.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Publicació d’imatges i veu en els espais de comunicació i difusió dels serveis educatius.": "Puede consultar información adicional sobre este tratamiento en la web del Departamento (educacio.gencat.cat), en el apartado Departamento > Protección de datos > Registro de actividades de tratamiento > Lista alfabética > Publicación de imágenes y voz en los espacios de comunicación y difusión de los servicios educativos.",

    "La publicació i el desament d’obres originals es regeixen pel Reial decret legislatiu 1/1996 (Llei de propietat intel·lectual). El consentiment és revocable i la revocació no té efectes retroactius.": "La publicación y guardado de obras originales se rigen por el Real decreto legislativo 1/1996 (Ley de propiedad intelectual). El consentimiento es revocable y la revocación carece de efectos retroactivos.",
    "Les autoritzacions de consentiment (imatges/obres) són vàlides fins a la seva modificació o revocació. Les comunicacions i autoritzacions organitzatives s’apliquen durant l’escolarització, amb possibilitat de modificar-les si canvien les circumstàncies familiars.": "Las autorizaciones de consentimiento (imágenes/obras) son válidas hasta su modificación o revocación. Las comunicaciones y autorizaciones organizativas se aplicarán durante la escolarización, con posibilidad de modificarlas si cambian las circunstancias familiares.",
    "4. Autoritzacions per utilitzar plataformes i eines digitals": "4. Autorizaciones para utilizar plataformas y herramientas digitales",
    "Finalitat: gestionar l’activitat educativa mitjançant les plataformes digitals que el Departament habilita per a l’alumnat. Entre d’altres, crear i gestionar comptes d’usuari per accedir a les eines de cada plataforma amb l’objectiu de facilitar l’aprenentatge digital i l’adquisició de competències digitals, seguint el currículum educatiu.": "Finalidad: gestionar la actividad educativa mediante las plataformas digitales que el Departamento habilita para el alumnado. Entre otros, crear y gestionar cuentas de usuario para acceder a las herramientas de cada plataforma con el objetivo de facilitar el aprendizaje digital y la adquisición de competencias digitales, siguiendo el currículum educativo.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica >Plataformes i eines digitals educatives dels centres educatius": "Puede consultar información adicional sobre este tratamiento en la web del Departamento (educacio.gencat.cat), en el apartado Departamento > Protección de datos > Registro de actividades de tratamiento > Lista alfabética >Plataformas y herramientas digitales educativas de los centros educativos",
    "Comunicació sobre l’ús de plataformes i eines digitals en l’àmbit educatiu": "Comunicación sobre el uso de plataformas y herramientas digitales en el ámbito educativo",
    "1. Informació sobre les plataformes digitals": "1. Información sobre las plataformas digitales",
    "El centre educatiu utilitza plataformes i eines digitals habilitades pel Departament d’Educació i Formació Professional, o autoritzades institucionalment per a finalitats educatives i professionals, per facilitar el desenvolupament de l’activitat educativa, docent i organitzativa del centre i contribuir a l’assoliment de les competències digitals incloses en el currículum educatiu vigent, tant en l’escolarització obligatòria com en la postobligatòria, d’acord amb la normativa vigent.": "El centro educativo utiliza plataformas y herramientas digitales habilitadas por el Departamento de Educación y Formación Profesional, o autorizadas institucionalmente para fines educativos y profesionales, para facilitar el desarrollo de la actividad educativa, docente y organizativa del centro y contribuir a la consecución de las competencias digitales incluidas en el currículum educativo vigente, tanto en la escolarización obligatoria como en la post obligatoria.",
    "Les eines i plataformes que es poden utilitzar són:": "Las herramientas y plataformas que se pueden utilizar son:",
    "Google Workspace for Education": "Google Workspace for Education",
    "Microsoft 365 Educació": "Microsoft 365 Educación",
    "Moodle": "Moodle",
    "Altres eines i serveis digitals amb finalitats educatives autoritzats pel Departament d’Educació i Formació Professional o pel centre educatiu": "Otras herramientas y servicios digitales con fines educativos autorizados por el Departamento de Educación y Formación Profesional o por el centro educativo",
    "Aquestes plataformes ofereixen entorns virtuals d’aprenentatge, eines de comunicació, treball col·laboratiu, videoconferència, emmagatzematge i gestió acadèmica que donen suport a les activitats docents, educatives i organitzatives del centre.": "Estas plataformas ofrecen entornos virtuales de aprendizaje, herramientas de comunicación, trabajo colaborativo, videoconferencia, almacenamiento y gestión académica que apoyan las actividades docentes, educativas y organizativas del centro.",
    "L’ús d’aquestes eines comporta la creació i gestió de comptes corporatius del professorat dins dels entorns digitals educatius institucionals.": "El uso de estas herramientas comporta la creación y gestión de cuentas corporativas del profesorado dentro de los entornos digitales educativos institucionales.",
    "Els serveis digitals associats tenen una finalitat estrictament educativa, docent, professional i organitzativa, i s’utilitzen en el marc de les funcions pròpies del sistema educatiu.": "Los servicios digitales asociados tienen una finalidad estrictamente educativa, docente, profesional y organizativa y se utilizan en el marco de las funciones propias del sistema educativo.",
    "1.1. Finalitat i ús educatiu de les plataformes digitals": "1.1. Finalidad y uso educativo de las plataformas digitales",
    "Les plataformes i eines digitals s’utilitzen per:": "Las plataformas y herramientas digitales se utilizan por:",
    "desenvolupar activitats educatives i acadèmiques;": "desarrollar actividades educativas y académicas;",
    "facilitar la comunicació i el treball col·laboratiu entre els membres de la comunitat educativa;": "facilitar la comunicación y el trabajo colaborativo entre los miembros de la comunidad educativa;",
    "gestionar activitats docents i organitzatives del centre;": "gestionar actividades docentes y organizativas del centro;",
    "elaborar, compartir i gestionar continguts i recursos educatius digitals;": "elaborar, compartir y gestionar contenidos y recursos educativos digitales;",
    "participar en entorns virtuals d’aprenentatge, i": "participar en entornos virtuales de aprendizaje, y",
    "contribuir al desenvolupament de les competències digitals de l’alumnat i del professorat.": "contribuir al desarrollo de las competencias digitales del alumnado y del profesorado.",
    "1.2. Mesures de control i seguretat": "1.2. Medidas de control y seguridad",
    "El centre educatiu i el Departament d’Educació i Formació Professional adopten mesures tècniques i organitzatives per garantir un ús segur, adequat i proporcional de les plataformes i eines digitals utilitzades en l’àmbit educatiu. Les principals són:": "El centro educativo y el Departamento de Educación y Formación Profesional adoptan medidas técnicas y organizativas para garantizar un uso seguro, adecuado y proporcional de las plataformas y herramientas digitales utilizadas en el ámbito educativo. Las principales son:",
    "Els comptes del professorat es gestionen dins d’un entorn institucional controlat i configurat amb mesures de seguretat adequades a les finalitats educatives i professionals del servei.": "Las cuentas del profesorado se gestionan dentro de un entorno institucional controlado y configurado con medidas de seguridad adecuadas a los fines educativos y profesionales del servicio.",
    "Amb caràcter general, els serveis digitals s’utilitzen en entorns restringits a la comunitat educativa i amb controls d’accés que limiten la comunicació i la compartició de continguts a les persones autoritzades.": "A todos los efectos, los servicios digitales se utilizan en entornos restringidos a la comunidad educativa y con controles de acceso que limitan la comunicación y la compartición de contenidos a las personas autorizadas.",
    "El Departament i els centres educatius adopten igualment mesures de minimització de dades, una configuració segura dels serveis digitals i la limitació de funcionalitats no necessàries per a l’activitat educativa, amb la finalitat de protegir la privacitat dels usuaris i garantir un ús adequat de les tecnologies digitals.": "El Departamento y los centros educativos adoptan igualmente medidas de minimización de datos, una configuración segura de los servicios digitales y la limitación de funcionalidades no necesarias para la actividad educativa, con el fin de proteger la privacidad de los usuarios y garantizar un adecuado uso de las tecnologías digitales.",
    "Els serveis o productes addicionals que no siguin necessaris per al desenvolupament ordinari de l’activitat educativa es poden mantenir desactivats o subjectes a condicions específiques d’ús.": "Los servicios o productos adicionales que no sean necesarios para el desarrollo ordinario de la actividad educativa pueden mantenerse desactivados o sujetos a condiciones específicas de uso.",
    "2. Compromisos i responsabilitats": "2. Compromisos y responsabilidades",
    "Els principals compromisos i responsabilitats associats a l’ús de les plataformes i eines digitals són:": "Los principales compromisos y responsabilidades asociados al uso de las plataformas y herramientas digitales son:",
    "Les plataformes i eines digitals de l’àmbit educatiu s’utilitzen exclusivament per a finalitats educatives, pedagògiques, orientadores i professionals vinculades a l’activitat docent i organitzativa del centre educatiu.": "Las plataformas y herramientas digitales del ámbito educativo se utilizan exclusivamente para fines educativos, pedagógicos, orientadores y profesionales vinculados a la actividad docente y organizativa del centro educativo.",
    "Els serveis, funcionalitats o productes addicionals vinculats a aquestes plataformes digitals que no siguin necessaris per a l’activitat educativa habitual es poden mantenir desactivats o subjectes a condicions específiques d’ús establertes pel Departament o pel centre educatiu. En aquests casos, no s’hi poden utilitzar dades personals de l’alumnat ni permetre que l’alumnat hi accedeixi directament amb el seu compte o interactuï amb continguts no verificats.": "Los servicios, funcionalidades o productos adicionales vinculados a estas plataformas digitales que no sean necesarios para la actividad educativa habitual pueden mantenerse desactivados o sujetos a condiciones específicas de uso establecidas por el Departamento o por el centro educativo. En estos casos, no se pueden utilizar datos personales del alumnado ni permitir que el alumnado acceda directamente con su cuenta o interactúe con contenidos no verificados.",
    "El professorat es compromet a utilitzar els comptes i les eines digitals de manera diligent i confidencial, d’acord amb la normativa vigent, i a adoptar les mesures necessàries per protegir les dades personals i evitar accessos no autoritzats, usos indeguts o comunicacions no autoritzades de la informació.": "El profesorado se compromete a utilizar las cuentas y herramientas digitales de forma diligente y confidencial, de acuerdo con la normativa vigente, ya adoptar las medidas necesarias para proteger los datos personales y evitar accesos no autorizados, usos indebidos o comunicaciones no autorizadas de la información.",
    "Al web del centre educatiu es pot consultar informació addicional sobre les normes d’ús, seguretat i funcionament de les eines digitals utilitzades en el desenvolupament de l’activitat educativa.": "En la web del centro educativo se puede consultar información adicional sobre las normas de uso, seguridad y funcionamiento de las herramientas digitales utilizadas en el desarrollo de la actividad educativa.",
    "L’usuari és responsable de qualsevol ús de plataformes, aplicacions o serveis digitals diferents dels habilitats o autoritzats pel Departament d’Educació i Formació Professional o pel centre educatiu, així com de qualsevol ús diferent del previst en aquest document, i ha de garantir en tot moment el compliment de la normativa vigent en matèria de protecció de dades, seguretat de la informació i ús adequat de les tecnologies digitals.": "El usuario es responsable de cualquier uso de plataformas, aplicaciones o servicios digitales distintos a los habilitados o autorizados por el Departamento de Educación y Formación Profesional o por el centro educativo, así como de cualquier uso diferente al previsto en este documento, y debe garantizar en todo momento el cumplimiento de la normativa vigente en materia de protección de datos, seguridad de la información y uso adecuado de las tecnologías digitales.",
    "Declaro": "Declaro",
    "Que he rebut informació sobre l’ús de les plataformes i eines digitals en l’àmbit educatiu, sobre les seves finalitats pedagògiques i educatives, així com la informació sobre el tractament de dades personals associat al seu ús.": "Que he recibido información sobre el uso de las plataformas y herramientas digitales en el ámbito educativo, sobre sus fines pedagógicos y educativos, así como la información sobre el tratamiento de datos personales asociado a su uso.",
    "5. Autoritzacions de salut": "5. Autorizaciones de salud",

    "Finalitat: l’atenció de les necessitats de salut de l’alumnat al centre educatiu.": "Finalidad: la atención de las necesidades de salud del alumnado en el centro educativo.",
    "L’alumne/a té diagnosticat/s el/s problema/es de salut següent/s (indiqueu si es produeix per contacte, ingestió o inhalació, i les reaccions que pot presentar):": "El alumno/a tiene diagnosticado/s el/los problema/s de salud siguiente/s (indique si se produce por contacto, ingestión o inhalación, y las reacciones que puede presentar):",
    "Declaro que és imprescindible que l’alumne/a prengui medicació en horari lectiu, com consta en el pla de medicació adjunt (el qual ha d’incloure del nom de l’alumne/a, el nom del medicament i la pauta d’administració).": "Declaro que es imprescindible que el alumno/a tome medicación en horario lectivo, como consta en el plan de medicación adjunto (el cual debe incluir del nombre del alumno/a, el nombre del medicamento y la pauta de administración).",
    "Sí, autoritzo la direcció del centre educatiu i el personal del centre perquè administri a l’alumne/a la medicació prescrita, d’acord amb les pautes que constin en el pla de medicació esmentat anteriorment.": "Sí, autorizo ​​a la dirección del centro educativo y al personal del centro para que administre al alumno/a la medicación prescrita, de acuerdo con las pautas que consten en el plan de medicación mencionado anteriormente.",
    "Aquesta autorització no tindrà efectes pràctics si no es presenta amb l’informe mèdic corresponent.": "Esta autorización no tendrá efectos prácticos si no se presenta con el informe médico correspondiente.",
    "Autoritzo que el centre educatiu pugui administrar paracetamol a l’alumne/a en cas que presenti febre superior a 38 °C de temperatura corporal mentre s’espera l’arribada d’algun familiar que el pugui portar a casa (també en sortides escolars i colònies programades considerades activitats lectives).": "Autorizo ​​que el centro educativo pueda administrar paracetamol al alumno/a en caso de que presente fiebre superior a 38 °C de temperatura corporal mientras se espera la llegada de algún familiar que pueda llevarlo a casa (también en salidas escolares y colonias programadas consideradas actividades lectivas).",

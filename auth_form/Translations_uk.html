    "Proporcionar experiències culturals, socials, ambientals i d'orientació mitjançant activitats, sortides, xerrades, concursos i certàmens.": "Надавати культурний, соціальний, екологічний і профорієнтаційний досвід через заходи, виїзди, лекції, конкурси та події.",
    "Facilitar un correu electrònic corporatiu, incentivar l'ús responsable de les tecnologies i informar del PEC, de les NOFC i dels acords sobre l'ús dels telèfons mòbils.": "Надати корпоративну електронну пошту, заохочувати відповідальне використання технологій та інформувати про PEC, NOFC і домовленості щодо використання мобільних телефонів.",
    "Derivar als serveis sanitaris qualsevol lesió o patologia quan sigui raonable, col·laborar amb l'AFA i revisar i millorar l'acció educativa amb aportacions de la comunitat.": "За потреби направляти травми або захворювання до медичних служб, співпрацювати з AFA та переглядати й покращувати освітню діяльність із внеском спільноти.",
    "Realitzar activitats que fomentin hàbits saludables i la pràctica d'activitat física i esportiva.": "Проводити заходи, що сприяють здоровим звичкам, фізичній активності та спорту.",
    "Per part de la família i l'alumne/a": "З боку сім’ї та учня/учениці",
    "Respectar el sistema educatiu català, el caràcter propi de l'institut i l'autoritat del tutor/a, del professorat i de l'equip directiu.": "Поважати каталонську систему освіти, характер закладу та авторитет куратора, педагогічного складу й керівництва.",
    "Compartir amb el centre l'educació de l'alumne/a i afavorir el seu desenvolupament acadèmic i personal.": "Спільно із закладом дбати про освіту учня/учениці та підтримувати його/її академічний і особистий розвиток.",
    "Considerar les recomanacions del centre relatives a atenció educativa, derivacions, repetició o promoció de curs i orientació acadèmica.": "Брати до уваги рекомендації закладу щодо освітньої підтримки, направлень, повторення або переведення курсу та академічної орієнтації.",
    "Instar l'alumne/a a respectar les normes de funcionament del centre, el deure d'estudi, el respecte als altres i les normes de convivència.": "Заохочувати учня/ученицю дотримуватися правил закладу, обов’язку навчатися, поваги до інших і правил співіснування.",
    "Facilitar a l'institut informacions rellevants per al procés d'aprenentatge i la salut de l'alumne/a.": "Надавати закладу інформацію, важливу для навчального процесу та здоров’я учня/учениці.",
    "Aportar documents de justificació oficial en cas d'absència.": "Надавати офіційні підтвердні документи у разі відсутності.",
    "No enviar l'alumne/a a l'institut quan tingui febre, malalties contagioses, infeccions per polls o causes equivalents, i recollir-lo personalment o mitjançant una persona major d'edat autoritzada quan calgui.": "Не відправляти учня/ученицю до закладу за наявності температури, заразних хвороб, педикульозу або подібних причин, а за потреби забирати особисто або через уповноважену повнолітню особу.",
    "Atendre en un període raonable les peticions d'entrevista o comunicació del centre i assistir puntualment a les reunions.": "У розумний строк відповідати на запити закладу щодо зустрічей або комунікації та приходити на зустрічі вчасно.",
    "Respectar les NOFC i la regulació dels telèfons mòbils.": "Дотримуватися NOFC і правил використання мобільних телефонів.",
    "Informar l'alumne/a menor d'edat de la signatura d'aquesta Carta de compromís educatiu i del que implica.": "Повідомити неповнолітнього учня/ученицю про підписання цієї Освітньої угоди та її наслідки.",
    "I perquè així consti, ho signem a tots els efectes, a partir de la data d'avui.": "На підтвердження цього ми підписуємо документ для всіх цілей від сьогоднішньої дати.",
    "He llegit i accepto la Carta de compromís educatiu.": "Я прочитав/прочитала й приймаю Освітню угоду.",
    "7. Normativa d'ús de telèfons mòbils": "7. Правила використання мобільних телефонів",
    "Normativa d'ús de telèfons mòbils": "Правила використання мобільних телефонів",
    "Arran de l'aprovació de l'actualització de les NOFC, us informem de la normativa que regularà l'ús dels telèfons mòbils a l'institut Ernest Lluch i Martín.": "Після затвердження оновлення NOFC повідомляємо вам правила, що регулюватимуть використання мобільних телефонів в Institut Ernest Lluch i Martín.",
    "El centre entén que no hi ha cap urgència que justifiqui la utilització del telèfon mòbil. L'institut disposa de telèfon i personal de consergeria per agilitzar qualsevol informació que hagi d'arribar de les famílies a l'alumnat i viceversa.": "Заклад вважає, що немає жодної термінової потреби, яка виправдовує використання мобільного телефону. У закладі є телефон і персонал рецепції, щоб оперативно передавати інформацію між сім’ями та учнями.",
    "L'ús de telèfons mòbils està prohibit per a l'alumnat en tots els espais del centre educatiu i en totes les activitats educatives que puguin tenir lloc fora del centre. La tinència del dispositiu només és possible si està completament apagat en entrar al centre i si l'institut té constància escrita del consentiment familiar.": "Використання мобільних телефонів учнями заборонено в усіх приміщеннях закладу та на всіх освітніх заходах поза ним. Наявність пристрою можлива лише якщо він повністю вимкнений при вході до закладу і якщо заклад має письмову згоду сім’ї.",
    "Aquestes indicacions també s'han de complir en activitats fora del centre: sortides, colònies, viatges, projectes compartits, activitats amb famílies o comunitat educativa, extraescolars i activitats amb entitats de l'entorn.": "Ці вказівки також потрібно виконувати під час заходів поза закладом: виїздів, таборів, подорожей, спільних проєктів, заходів із сім’ями або освітньою спільнотою, позакласних заходів та заходів із місцевими організаціями.",
    "Estudis postobligatoris": "Післяобов’язкова освіта",
    "L'alumnat d'estudis postobligatoris ha de fer un ús responsable dels dispositius mòbils i vincular-los a les activitats d'aprenentatge quan el professorat ho indiqui.": "Учні післяобов’язкових програм мають відповідально використовувати мобільні пристрої та пов’язувати їх з навчальною діяльністю, коли це вказує викладач.",
    "Excepcionalitats": "Винятки",
    "Salut: es permet utilitzar un dispositiu quan l'alumnat tingui una necessitat específica per motius de salut.": "Здоров’я: пристрій можна використовувати, коли учень/учениця має специфічну потребу за станом здоров’я.",
    "NESE: es permet utilitzar un dispositiu quan sigui necessari per facilitar l'accés a l'aprenentatge, la participació o la comunicació.": "NESE: пристрій можна використовувати, коли він потрібен для доступу до навчання, участі або комунікації.",
    "Emergències: en una situació d'emergència, l'alumnat pot utilitzar el telèfon mòbil per comunicar-se amb la família.": "Надзвичайні ситуації: у надзвичайній ситуації учень/учениця може використати мобільний телефон для зв’язку з сім’єю.",
    "Mesures correctores i sancions": "Коригувальні заходи та санкції",
    "L'ús del telèfon mòbil sense consentiment previ d'un docent pot constituir una falta lleu si no afecta drets fonamentals o protecció de dades.": "Використання мобільного телефону без попередньої згоди викладача може бути легким порушенням, якщо не зачіпає основні права або захист даних.",
    "L'ús que vulneri drets fonamentals pot constituir una falta greument perjudicial per a la convivència i comportar expedient disciplinari.": "Використання, що порушує основні права, може бути серйозним порушенням співіснування і призвести до дисциплінарного провадження.",
    "Si un alumne/a es nega a lliurar el telèfon quan se li demana, es considera falta molt greu.": "Якщо учень/учениця відмовляється передати телефон на вимогу, це вважається дуже серйозним порушенням.",
    "L'institut no es fa responsable de desperfectes o robatoris. Les famílies i l'alumnat han de conèixer aquesta normativa, i qualsevol professor/a pot comprovar que el telèfon està completament apagat.": "Заклад не несе відповідальності за пошкодження або крадіжки. Сім’ї та учні мають знати ці правила, і будь-який викладач може перевірити, що телефон повністю вимкнений.",
    "Només es considera realment apagat si l'accés a qualsevol aplicació necessita que el dispositiu iniciï el sistema operatiu. No ho són el bloqueig de pantalla, el mode avió, el mode rellotge o estats equivalents.": "Телефон вважається справді вимкненим лише тоді, коли для доступу до будь-якої програми пристрій має запустити операційну систему. Блокування екрана, режим польоту, режим годинника або подібні стани не вважаються вимкненням.",
    "En cas d'ús de telèfon mòbil sense consentiment familiar o sense complir la normativa, s'aplicaran les mesures disciplinàries corresponents.": "У разі використання мобільного телефону без згоди сім’ї або без дотримання правил застосовуватимуться відповідні дисциплінарні заходи.",
    "Consentiment sobre la tinència de telèfon mòbil al centre": "Згода щодо наявності мобільного телефону в закладі",
    "NO DONO EL MEU CONSENTIMENT a què el meu fill/a porti telèfon mòbil, atenent-me a la normativa aquí descrita.": "Я НЕ ДАЮ ЗГОДИ, щоб моя дитина приносила мобільний телефон, відповідно до описаних тут правил.",
    "DONO EL MEU CONSENTIMENT PARTICULAR a què el meu fill/a porti telèfon mòbil al centre, atenent-me a la normativa aquí descrita.": "Я ДАЮ ОКРЕМУ ЗГОДУ, щоб моя дитина приносила мобільний телефон до закладу, відповідно до описаних тут правил.",
    "8. Lloc, data i signatures": "8. Місце, дата і підписи",
    "Carregant": "завантаження",
    "Preparant el formulari...": "Підготовка форми...",
    "2. Autoritzacions per a l’estada de l’alumnat al centre": "2. Дозволи студентам на перебування в центрі",
    "Informació bàsica sobre protecció de dades personals": "Основні відомості про захист персональних даних",
    "Responsable: direcció del centre educatiu, de titularitat del Departament d’Educació i Formació Professional.": "Відповідальні: керівництво навчального центру, власником якого є відділ освіти та ПТО.",
    "Finalitat: la funció educativa i la gestió de la permanència i la sortida de l’alumnat del centre. L’atenció de les necessitats sanitàries de l’alumnat.": "Призначення: виховна функція та управління перебуванням і відбуттям студентів центру. Увага до оздоровчих потреб учнів.",
    "Drets: es poden exercir els drets d’accés, rectificació, supressió, limitació del tractament, oposició i la resta de drets previstos per la normativa vigent davant la direcció del centre educatiu. També es pot presentar una reclamació davant l’Autoritat Catalana de Protecció de Dades.": "Права: ви можете скористатися правами доступу, виправлення, видалення, обмеження обробки, заперечення та іншими правами, передбаченими чинними правилами, перед керівництвом освітнього центру. Претензію також можна подати до Каталонського органу захисту даних.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Alumnes de centres educatius de titularitat del Departament d’Educació i Formació Professional.": "Ви можете отримати додаткову інформацію про це звернення на веб-сайті Департаменту (educacio.gencat.cat), у розділі Департамент > Захист даних > Запис заходів лікування > Алфавітний список > Студенти навчальних центрів, що належать Департаменту освіти та професійної підготовки.",
    "Autoritzo, com a responsable legal de l’alumne/a:": "Я дозволяю, як законний опікун студента:",
    "Sortida amb/sense acompanyament del centre fora de l’horari lectiu (d’acord amb les normes d’organització i funcionament del centre, NOFC, aprovades pel consell escolar del centre)": "Вихід із/без супроводу в позаурочний час (згідно з правилами організації та роботи центру, НОФК, затвердженими радою школи центру)",
    "Que l’alumne/a marxi del centre fora de l’horari lectiu acompanyat/ada per les persones següents (un cop s’hagin acreditat documentalment):": "Що учень залишає центр у позашкільний час у супроводі таких осіб (якщо вони мають документи):",
    "3. Publicacions: protecció de dades i propietat intel·lectual": "3. Публікації: захист даних та інтелектуальна власність",
    "La publicació d’imatges/veu i del material elaborat és opcional i no condiciona l’activitat lectiva. El consentiment és revocable i sense efectes retroactius.": "Публікація зображень/голосу та підготовленого матеріалу є необов’язковою та не обумовлює викладацьку діяльність. Згода є відкликаною та не має зворотної сили.",
    "Finalitat: la gestió de la difusió i conservació del material elaborat per l’alumnat, i l’ús de la imatge i veu en espais de comunicació digitals.": "Мета: управління розповсюдженням та збереженням матеріалу, створеного студентами, а також використанням зображення та голосу в цифрових комунікаційних просторах.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica > Publicació d’imatges i veu en els espais de comunicació i difusió dels serveis educatius.": "Ви можете отримати додаткову інформацію про це лікування на веб-сайті Департаменту (educacio.gencat.cat), у розділі Департамент > Захист даних > Запис заходів лікування > Алфавітний список > Публікація зображень і голосу в зонах комунікації та розповсюдження освітніх послуг.",
    "Ús d’imatges, publicació de dades de caràcter personal i material elaborat": "Використання зображень, публікація персональних даних і підготовленого матеріалу",
    "1. La publicació de la imatge/veu de l’alumne/a en activitats del centre:": "1. Публікація зображення/голосу студента в діяльності центру:",
    "— Intranet amb accés restringit (plataformes del centre: Moodle/Àgora, Google Workspace, etc.):": "— Інтранет з обмеженим доступом (центральні платформи: Moodle/Àgora, Google Workspace тощо):",
    "— Internet amb accés obert (web, blogs del centre):": "— Інтернет з відкритим доступом (веб, блоги центру):",
    "— Plataformes no administrades pel centre (YouTube, Instagram, altres —especifiqueu-les—):": "— Платформи, які не адмініструються центром (YouTube, Instagram, інші — вказати —):",
    "Plataformes/Accés:": "Платформи/Доступ:",
    "2. La publicació de les inicials de l’alumne/a i del centre:": "2. Публікація ініціалів студента та центру:",
    "Publicació i preservació d’obres i creacions": "Публікація та збереження творів і творінь",
    "1. La publicació del material que elabori l’alumne/a (treball de síntesi, projecte de recerca, obra final, etc.) a plataformes d’accés obert:": "1. Публікація підготовленого студентом матеріалу (узагальнюючої роботи, наукового проекту, випускної роботи тощо) на платформах відкритого доступу:",
    "2. La publicació de l’obra que elabori l’alumne/a en espais de comunicació del centre (web, blogs, revistes, xarxes gestionades pel centre):": "2. Публікація роботи студента в комунікаційних просторах центру (веб, блоги, журнали, мережі, якими керує центр):",
    "3. La preservació/desament de l’obra:": "3. Збереження роботи:",
    "— A la biblioteca física o digital del centre:": "— У фізичній або цифровій бібліотеці центру:",
    "— Al repositori del Departament:": "— У фондах кафедри:",
    "Actuacions necessàries per a la publicació i el desament (si escau):": "Дії, необхідні для публікації та збереження (якщо є):",
    "La publicació i el desament d’obres originals es regeixen pel Reial decret legislatiu 1/1996 (Llei de propietat intel·lectual). El consentiment és revocable i la revocació no té efectes retroactius.": "Публікація та зберігання оригінальних творів регулюються Королівським законодавчим указом 1/1996 (Закон про інтелектуальну власність). Згода є відкликаною, а відкликання не має зворотної сили.",
    "Les autoritzacions de consentiment (imatges/obres) són vàlides fins a la seva modificació o revocació. Les comunicacions i autoritzacions organitzatives s’apliquen durant l’escolarització, amb possibilitat de modificar-les si canvien les circumstàncies familiars.": "Дозволи згоди (зображення/роботи) дійсні, доки не буде змінено або відкликано. Організаційні комунікації та дозволи застосовуються під час навчання в школі з можливістю їх зміни в разі зміни сімейних обставин.",
    "4. Autoritzacions per utilitzar plataformes i eines digitals": "4. Дозволи на використання цифрових платформ та інструментів",
    "Finalitat: gestionar l’activitat educativa mitjançant les plataformes digitals que el Departament habilita per a l’alumnat. Entre d’altres, crear i gestionar comptes d’usuari per accedir a les eines de cada plataforma amb l’objectiu de facilitar l’aprenentatge digital i l’adquisició de competències digitals, seguint el currículum educatiu.": "Мета: управління освітньою діяльністю через цифрові платформи, які кафедра надає для студентів. Серед іншого, створюйте та керуйте обліковими записами користувачів для доступу до інструментів кожної платформи з метою сприяння цифровому навчанню та набуттю цифрових навичок відповідно до навчальної програми.",
    "Podeu consultar informació addicional sobre aquest tractament al web del Departament (educacio.gencat.cat), a l’apartat Departament > Protecció de dades > Registre d’activitats de tractament > Llista alfabètica >Plataformes i eines digitals educatives dels centres educatius": "Ви можете отримати додаткову інформацію про це звернення на веб-сайті Департаменту (educacio.gencat.cat), у Відділі > Захист даних > Запис заходів лікування > Алфавітний список > Цифрові освітні платформи та інструменти освітніх центрів",
    "Comunicació sobre l’ús de plataformes i eines digitals en l’àmbit educatiu": "Комунікація щодо використання цифрових платформ та інструментів в освітній сфері",
    "1. Informació sobre les plataformes digitals": "1. Інформація про цифрові майданчики",
    "El centre educatiu utilitza plataformes i eines digitals habilitades pel Departament d’Educació i Formació Professional, o autoritzades institucionalment per a finalitats educatives i professionals, per facilitar el desenvolupament de l’activitat educativa, docent i organitzativa del centre i contribuir a l’assoliment de les competències digitals incloses en el currículum educatiu vigent, tant en l’escolarització obligatòria com en la postobligatòria, d’acord amb la normativa vigent.": "Освітній центр використовує цифрові платформи та інструменти, надані Департаментом освіти та професійної підготовки, або інституційно уповноважені для освітніх і професійних цілей, щоб сприяти розвитку освітньої, навчальної та організаційної діяльності центру та сприяти досягненню цифрових навичок, включених до поточної навчальної програми, як в обов’язковій, так і після обов’язковій шкільній освіті, відповідно до чинних правил.",
    "Les eines i plataformes que es poden utilitzar són:": "Інструменти та платформи, які можна використовувати:",
    "Google Workspace for Education": "Google Workspace for Education",
    "Microsoft 365 Educació": "Microsoft 365 Education",
    "Moodle": "Moodle",
    "Altres eines i serveis digitals amb finalitats educatives autoritzats pel Departament d’Educació i Formació Professional o pel centre educatiu": "Інші цифрові інструменти та послуги для освітніх цілей, дозволені Департаментом освіти та професійної підготовки або освітнім центром",
    "Aquestes plataformes ofereixen entorns virtuals d’aprenentatge, eines de comunicació, treball col·laboratiu, videoconferència, emmagatzematge i gestió acadèmica que donen suport a les activitats docents, educatives i organitzatives del centre.": "Ці платформи пропонують віртуальні навчальні середовища, інструменти спілкування, спільну роботу, відеоконференції, зберігання та академічне управління, які підтримують навчальну, освітню та організаційну діяльність центру.",
    "L’ús d’aquestes eines comporta la creació i gestió de comptes corporatius del professorat dins dels entorns digitals educatius institucionals.": "Використання цих інструментів передбачає створення та керування корпоративними обліковими записами для вчителів у інституційних цифрових освітніх середовищах.",
    "Els serveis digitals associats tenen una finalitat estrictament educativa, docent, professional i organitzativa, i s’utilitzen en el marc de les funcions pròpies del sistema educatiu.": "Супутні цифрові послуги мають суто освітню, навчальну, професійну та організаційну мету та використовуються в рамках власних функцій освітньої системи.",

    "desenvolupar activitats educatives i acadèmiques;": "розвивати навчальну та навчальну діяльність;",
    "facilitar la comunicació i el treball col·laboratiu entre els membres de la comunitat educativa;": "сприяти спілкуванню та співпраці між членами освітньої спільноти;",

    "elaborar, compartir i gestionar continguts i recursos educatius digitals;": "розробляти, ділитися та керувати контентом і цифровими освітніми ресурсами;",
    "participar en entorns virtuals d’aprenentatge, i": "брати участь у віртуальних навчальних середовищах, i",
    "contribuir al desenvolupament de les competències digitals de l’alumnat i del professorat.": "сприяти розвитку цифрових навичок учнів та вчителів.",
    "1.2. Mesures de control i seguretat": "1.2. Заходи контролю та безпеки",
    "El centre educatiu i el Departament d’Educació i Formació Professional adopten mesures tècniques i organitzatives per garantir un ús segur, adequat i proporcional de les plataformes i eines digitals utilitzades en l’àmbit educatiu. Les principals són:": "Освітній центр і Департамент професійно-технічної освіти та навчання вживають технічних та організаційних заходів, щоб гарантувати безпечне, відповідне та пропорційне використання цифрових платформ та інструментів, що використовуються в освітній сфері. Основні з них:",
    "Els comptes del professorat es gestionen dins d’un entorn institucional controlat i configurat amb mesures de seguretat adequades a les finalitats educatives i professionals del servei.": "Обліковими записами вчителів керують у контрольованому інституційному середовищі та налаштовують заходи безпеки, що відповідають освітнім і професійним цілям служби.",
    "Amb caràcter general, els serveis digitals s’utilitzen en entorns restringits a la comunitat educativa i amb controls d’accés que limiten la comunicació i la compartició de continguts a les persones autoritzades.": "Загалом, цифрові служби використовуються в середовищах, обмежених для освітньої спільноти та з контролем доступу, який обмежує спілкування та обмін вмістом для авторизованих людей.",
    "El Departament i els centres educatius adopten igualment mesures de minimització de dades, una configuració segura dels serveis digitals i la limitació de funcionalitats no necessàries per a l’activitat educativa, amb la finalitat de protegir la privacitat dels usuaris i garantir un ús adequat de les tecnologies digitals.": "Департамент і освітні центри також вживають заходів з мінімізації даних, безпечної конфігурації цифрових послуг і обмеження функцій, які не є необхідними для освітньої діяльності, щоб захистити конфіденційність користувачів і гарантувати належне використання цифрових технологій.",
    "Els serveis o productes addicionals que no siguin necessaris per al desenvolupament ordinari de l’activitat educativa es poden mantenir desactivats o subjectes a condicions específiques d’ús.": "Додаткові послуги або продукти, які не є необхідними для звичайного розвитку освітньої діяльності, можуть залишатися деактивованими або підлягати певним умовам використання.",
    "2. Compromisos i responsabilitats": "2. Зобов'язання та відповідальність",
    "Els principals compromisos i responsabilitats associats a l’ús de les plataformes i eines digitals són:": "Основними зобов’язаннями та обов’язками, пов’язаними з використанням цифрових платформ та інструментів, є:",
    "Les plataformes i eines digitals de l’àmbit educatiu s’utilitzen exclusivament per a finalitats educatives, pedagògiques, orientadores i professionals vinculades a l’activitat docent i organitzativa del centre educatiu.": "Цифрові платформи та інструменти в освітній сфері використовуються виключно в освітніх, педагогічних, орієнтаційних та професійних цілях, пов’язаних із навчальною та організаційною діяльністю освітнього центру.",
    "Els serveis, funcionalitats o productes addicionals vinculats a aquestes plataformes digitals que no siguin necessaris per a l’activitat educativa habitual es poden mantenir desactivats o subjectes a condicions específiques d’ús establertes pel Departament o pel centre educatiu. En aquests casos, no s’hi poden utilitzar dades personals de l’alumnat ni permetre que l’alumnat hi accedeixi directament amb el seu compte o interactuï amb continguts no verificats.": "Послуги, функції чи додаткові продукти, пов’язані з цими цифровими платформами, які не є необхідними для звичайної освітньої діяльності, можуть залишатися деактивованими або підлягати особливим умовам використання, встановленим Департаментом або освітнім центром. У цих випадках особисті дані студентів не можуть бути використані, студентам не можна дозволити отримати до них прямий доступ зі свого облікового запису або взаємодіяти з неперевіреним вмістом.",
    "El professorat es compromet a utilitzar els comptes i les eines digitals de manera diligent i confidencial, d’acord amb la normativa vigent, i a adoptar les mesures necessàries per protegir les dades personals i evitar accessos no autoritzats, usos indeguts o comunicacions no autoritzades de la informació.": "Викладацький склад зобов’язується ретельно та конфіденційно використовувати облікові записи та цифрові інструменти відповідно до чинних нормативних актів, а також вживати необхідних заходів для захисту персональних даних і уникнення несанкціонованого доступу, неналежного використання чи неавторизованої передачі інформації.",
    "Al web del centre educatiu es pot consultar informació addicional sobre les normes d’ús, seguretat i funcionament de les eines digitals utilitzades en el desenvolupament de l’activitat educativa.": "На сайті освітнього центру ви можете ознайомитися з додатковою інформацією щодо правил використання, безпеки та експлуатації цифрових інструментів, які використовуються в розвитку навчальної діяльності.",
    "L’usuari és responsable de qualsevol ús de plataformes, aplicacions o serveis digitals diferents dels habilitats o autoritzats pel Departament d’Educació i Formació Professional o pel centre educatiu, així com de qualsevol ús diferent del previst en aquest document, i ha de garantir en tot moment el compliment de la normativa vigent en matèria de protecció de dades, seguretat de la informació i ús adequat de les tecnologies digitals.": "Користувач несе відповідальність за будь-яке використання платформ, додатків або цифрових сервісів, окрім навичок або санкціонованих Департаментом освіти та професійної підготовки чи навчальним центром, а також будь-яке використання, відмінне від передбаченого цим документом, і повинен завжди забезпечувати відповідність чинним нормам щодо захисту даних, інформаційної безпеки та відповідного використання цифрових технологій.",

    "Aquesta autorització no tindrà efectes pràctics si no es presenta amb l’informe mèdic corresponent.": "Цей дозвіл не матиме практичного ефекту, якщо до нього не буде надано відповідний медичний висновок.",
